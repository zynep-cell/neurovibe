<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVibe - Mindfulness Ecosystem</title>
    <style>
        :root { --bg: #fdfbfb; --accent: #333; --gold: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; color: #444; }
        
        .container { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.06); width: 100%; max-width: 460px; text-align: center; position: relative; }

        /* Profil ve Hava Durumu */
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 15px; }
        .profile-name { font-weight: bold; border: none; font-size: 1rem; color: var(--accent); outline: none; border-bottom: 1px dashed #ccc; width: 120px; }

        /* Kutlama */
        #celebration { position: absolute; top: -15px; left: 0; width: 100%; color: var(--gold); font-weight: bold; font-size: 1.2rem; display: none; z-index: 100; animation: sparkle 0.8s infinite alternate; pointer-events: none; }
        @keyframes sparkle { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.1); opacity: 1; } }

        /* Çizim Alanı */
        .canvas-container { position: relative; width: 280px; height: 280px; margin: 10px auto; border-radius: 50%; overflow: hidden; background: white; border: 4px solid #f9f9f9; box-shadow: inset 0 0 20px rgba(0,0,0,0.03); }
        canvas { cursor: crosshair; touch-action: none; }

        .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; background: #fcfcfc; padding: 10px; border-radius: 15px; }
        .tool-btn { padding: 6px; border: none; border-radius: 8px; cursor: pointer; background: #eee; font-size: 11px; transition: 0.2s; }
        .tool-btn.active { background: var(--accent); color: white; }
        
        .brush-settings { margin: 10px 0; display: flex; align-items: center; gap: 10px; font-size: 12px; }
        input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }

        /* Hava Durumu Seçimi */
        .weather-section { margin: 15px 0; text-align: left; }
        .weather-grid { display: flex; justify-content: space-between; margin-top: 8px; }
        .weather-icon { font-size: 20px; cursor: pointer; padding: 8px; border-radius: 10px; transition: 0.3s; border: 1px solid transparent; }
        .weather-icon:hover { background: #eee; }
        .weather-icon.active { background: #fff3cd; border-color: #ffeeba; transform: scale(1.1); }
        #weather-tip { font-size: 12px; font-style: italic; color: #d48806; margin-top: 8px; min-height: 18px; }

        /* Diğer Alanlar */
        .stress-box { background: #fcfcfc; padding: 12px; border-radius: 20px; margin: 10px 0; border: 1px solid #f0f0f0; }
        .habit-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
        .habit-chip { background: #f0f0f0; padding: 6px 12px; border-radius: 15px; font-size: 12px; cursor: pointer; }
        .habit-chip.active { background: #e8f5e9; border: 1px solid #4CAF50; }
        
        textarea { width: 100%; border-radius: 15px; border: 1px solid #eee; padding: 12px; box-sizing: border-box; margin: 10px 0; font-family: inherit; font-size: 13px; resize: none; }
        #save-btn { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 15px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }

        .log-item { background: white; padding: 15px; border-radius: 20px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); text-align: left; border-left: 6px solid var(--accent); position: relative; }
        .delete-log { position: absolute; right: 10px; top: 10px; color: #ddd; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div id="celebration">✨ HARİKASIN. DEVAM ET. ✨</div>
        
        <div class="header-row">
            <div>👋 <input type="text" id="userName" class="profile-name" placeholder="İsmin?"></div>
            <div id="date-now" style="font-size: 11px; color: #999;"></div>
        </div>
        
        <div class="canvas-container">
            <canvas id="paintCanvas" width="280" height="280"></canvas>
        </div>

        <div class="brush-settings">
            <span>Fırça:</span>
            <input type="range" id="sizeRange" min="1" max="50" value="10">
            <input type="color" id="colorPicker" value="#FFD700">
        </div>

        <div class="controls-grid">
            <button class="tool-btn active" id="btn-sulu" onclick="setTool('sulu')">💧 Sulu</button>
            <button class="tool-btn" id="btn-puskurtme" onclick="setTool('puskurtme')">💨 Püskürtme</button>
            <button class="tool-btn" id="btn-murekkep" onclick="setTool('murekkep')">🖋️ Mürekkep</button>
            <button class="tool-btn" id="btn-kursun" onclick="setTool('kursun')">✏️ Kurşun</button>
            <button class="tool-btn" onclick="setTool('eraser')">🧽 Silgi</button>
            <button class="tool-btn" style="background:#ffdada" onclick="undo()">↩️ Geri Al</button>
        </div>

        <div class="weather-section">
            <label style="font-size: 13px; font-weight: bold;">Şu an hava nasıl?</label>
            <div class="weather-grid">
                <span class="weather-icon" onclick="setWeather('sunny', '☀️')">☀️</span>
                <span class="weather-icon" onclick="setWeather('cloudy', '⛅')">⛅</span>
                <span class="weather-icon" onclick="setWeather('moon', '🌙')">🌙</span>
                <span class="weather-icon" onclick="setWeather('rainy', '🌧️')">🌧️</span>
                <span class="weather-icon" onclick="setWeather('stormy', '⚡')">⚡</span>
                <span class="weather-icon" onclick="setWeather('windy', '🌬️')">🌬️</span>
            </div>
            <div id="weather-tip"></div>
        </div>

        <div class="stress-box">
            <span id="stressLabel" style="font-size:12px; font-weight:bold;">Durum: İyiyim (0)</span>
            <input type="range" id="stressRange" min="0" max="10" value="0" oninput="updateStress(this.value)">
        </div>

        <div id="habitList" class="habit-list"></div>

        <textarea id="note" maxlength="300" rows="2" placeholder="Bugünün nasıldı?"></textarea>
        <button id="save-btn" onclick="saveData()">Günü Mühürle</button>
    </div>

    <div id="history" style="width:100%; max-width:460px; margin-top:20px;"></div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let currentTool = 'sulu';
    let undoStack = [];
    let selectedWeather = { type: '', icon: '' };

    // Fırça Ayarları ve Çizim
    function saveState() { if (undoStack.length > 25) undoStack.shift(); undoStack.push(canvas.toDataURL()); }
    function undo() { if (undoStack.length > 0) { let img = new Image(); img.src = undoStack.pop(); img.onload = () => { ctx.clearRect(0,0,280,280); ctx.drawImage(img,0,0); }; } }
    
    function startPosition(e) { saveState(); painting = true; draw(e); }
    function finishedPosition() { painting = false; ctx.beginPath(); }

    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        const color = document.getElementById('colorPicker').value;
        const size = document.getElementById('sizeRange').value;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = color;
        ctx.lineWidth = size;

        if (currentTool === 'eraser') {
            ctx.globalAlpha = 1.0; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 30;
        } else if (currentTool === 'sulu') {
            ctx.globalAlpha = 0.15; ctx.lineWidth = size * 1.5;
        } else if (currentTool === 'murekkep') {
            ctx.globalAlpha = 0.9; ctx.lineWidth = size * 0.5;
        } else if (currentTool === 'kursun') {
            ctx.globalAlpha = 0.3; ctx.lineWidth = 2; // Sabit ince uç
        } else if (currentTool === 'puskurtme') {
            ctx.fillStyle = color; ctx.globalAlpha = 0.3;
            for(let i=0; i<10; i++) ctx.fillRect(x + (Math.random()-0.5)*size, y + (Math.random()-0.5)*size, 1.5, 1.5);
            return;
        }
        ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', finishedPosition);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startPosition);
    canvas.addEventListener('touchend', finishedPosition);
    canvas.addEventListener('touchmove', draw);

    function setTool(t) {
        currentTool = t;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        if(t !== 'eraser') document.getElementById('btn-' + t)?.classList.add('active');
    }

    // Hava Durumu Mantığı
    const tips = {
        sunny: "Güneş kremini unutma, D vitamini al! ☀️",
        cloudy: "Hava yumuşak, biraz D vitamini hala orada! ⛅",
        moon: "Gökyüzüne, yıldızlara bakmayı unutma... 🌙",
        rainy: "Şemsiye kullan ve yağmur sesiyle sakinleş. 🌧️",
        stormy: "Unutma, her fırtına sonrası hava sakinleşir. ⚡",
        windy: "Kendini editteymiş gibi hayal et ;) 🌬️"
    };

    function setWeather(type, icon) {
        selectedWeather = { type, icon };
        document.querySelectorAll('.weather-icon').forEach(i => i.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('weather-tip').innerText = tips[type];
    }

    function updateStress(val) {
        let texts = ["İyiyim", "Ucundan stresli", "Ucundan stresli", "Az stresli", "Az stresli", "Nötr", "Giderek artıyor", "Giderek artıyor", "Stresliyim", "Stresliyim", "WOW, Az Sakinleş!"];
        document.getElementById('stressLabel').innerText = `Durum: ${texts[val]} (${val})`;
    }

    // Alışkanlıklar ve Profil
    let habits = JSON.parse(localStorage.getItem('neuro_habits')) || ["🦴 Lenf Vuruşları"];
    let activeHabits = [];
    document.getElementById('userName').value = localStorage.getItem('neuro_username') || "";
    document.getElementById('userName').onchange = (e) => localStorage.setItem('neuro_username', e.target.value);

    function renderHabits() {
        const list = document.getElementById('habitList');
        list.innerHTML = "";
        habits.forEach(h => {
            const div = document.createElement('div');
            div.className = `habit-chip ${activeHabits.includes(h) ? 'active' : ''}`;
            div.innerText = h;
            div.onclick = () => {
                if (activeHabits.includes(h)) activeHabits = activeHabits.filter(a => a !== h);
                else { activeHabits.push(h); showCelebration(); }
                renderHabits();
            };
            list.appendChild(div);
        });
    }

    function showCelebration() {
        const cel = document.getElementById('celebration');
        cel.style.display = 'block'; setTimeout(() => cel.style.display = 'none', 2000);
    }

    function saveData() {
        const entry = {
            id: Date.now(),
            user: document.getElementById('userName').value || "Bilinmeyen",
            time: new Date().toLocaleString('tr-TR'),
            weather: selectedWeather.icon,
            stress: document.getElementById('stressRange').value,
            habits: [...activeHabits],
            image: canvas.toDataURL(),
            note: document.getElementById('note').value
        };
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        logs.unshift(entry);
        localStorage.setItem('neuro_logs', JSON.stringify(logs));
        renderLogs();
        ctx.clearRect(0,0,280,280);
        document.getElementById('note').value = "";
        activeHabits = []; renderHabits();
    }

    function renderLogs() {
        const container = document.getElementById('history');
        const logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        container.innerHTML = "<h3>Zaman Tüneli</h3>";
        logs.forEach(item => {
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `
                <div class="delete-log" onclick="deleteLog(${item.id})">×</div>
                <div style="font-size:11px; color:#999">👤 ${item.user} | ${item.weather || ''} | ${item.time}</div>
                <div style="margin:10px 0"><img src="${item.image}" width="70" style="border-radius:50%; border:1px solid #eee"></div>
                <div style="font-size:12px"><b>Stres: ${item.stress}</b> | ${item.habits.join(', ')}</div>
                <div style="font-size:13px; font-style:italic; margin-top:5px">"${item.note}"</div>
            `;
            container.appendChild(div);
        });
    }

    function deleteLog(id) {
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        localStorage.setItem('neuro_logs', JSON.stringify(logs.filter(l => l.id !== id)));
        renderLogs();
    }

    setInterval(() => { document.getElementById('date-now').innerText = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}); }, 1000);
    renderHabits(); renderLogs();
</script>
</body>
</html>
