<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVibe - Alışkanlık Takibi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        
        /* Duygu Küresi */
        #sphere { width: 100px; height: 100px; border-radius: 50%; background: #eee; margin: 20px auto; transition: 0.5s; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .dot:hover { transform: scale(1.2); }

        /* Alışkanlıklar Bölümü */
        .habits { text-align: left; margin: 20px 0; border-top: 1px solid #eee; padding-top: 15px; }
        .habit-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }

        #save-btn { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; }
        
        /* Kayıt Listesi */
        #log-container { margin-top: 20px; width: 350px; }
        .log-item { background: white; padding: 10px; border-radius: 8px; margin-bottom: 5px; font-size: 12px; display: flex; justify-content: space-between; border-left: 5px solid #ccc; }
    </style>
</head>
<body>

    <div class="card">
        <h2>NeuroVibe</h2>
        <div id="sphere"></div>
        
        <div class="btn-group">
            <div class="dot" style="background:#FFD700" onclick="selectEmotion('#FFD700', 'Neşeli')"></div>
            <div class="dot" style="background:#87CEEB" onclick="selectEmotion('#87CEEB', 'Sakin')"></div>
            <div class="dot" style="background:#A9A9A9" onclick="selectEmotion('#A9A9A9', 'Yorgun')"></div>
            <div class="dot" style="background:#98FB98" onclick="selectEmotion('#98FB98', 'Odaklı')"></div>
        </div>

        <div class="habits">
            <div class="habit-row">
                <input type="checkbox" id="habit1"> <label for="habit1">Lenf Vuruşları Yapıldı</label>
            </div>
            <div class="habit-row">
                <input type="checkbox" id="habit2"> <label for="habit2">90-30 Kuralı Uygulandı</label>
            </div>
        </div>

        <button id="save-btn" onclick="saveData()">Günü Kaydet</button>
    </div>

    <div id="log-container">
        <!-- Kayıtlar buraya gelecek -->
    </div>

<script>
    let currentEmotion = { color: '#eee', name: 'Belirsiz' };

    function selectEmotion(color, name) {
        document.getElementById('sphere').style.backgroundColor = color;
        currentEmotion = { color, name };
    }

    function saveData() {
        const h1 = document.getElementById('habit1').checked;
        const h2 = document.getElementById('habit2').checked;
        const date = new Date().toLocaleDateString('tr-TR');

        const entry = { date, emotion: currentEmotion, habit1: h1, habit2: h2 };

        // LocalStorage'dan mevcut verileri al
        let history = JSON.parse(localStorage.getItem('neurovibe_logs')) || [];
        history.unshift(entry); // Yeni kaydı başa ekle
        localStorage.setItem('neurovibe_logs', JSON.stringify(history));

        renderLogs();
        alert("Kaydedildi! Yarın geldiğinde de burada olacak.");
    }

    function renderLogs() {
        const container = document.getElementById('log-container');
        const history = JSON.parse(localStorage.getItem('neurovibe_logs')) || [];
        container.innerHTML = '<h3>Geçmiş Kayıtlar</h3>';
        
        history.forEach(item => {
            const div = document.createElement('div');
            div.className = 'log-item';
            div.style.borderLeftColor = item.emotion.color;
            div.innerHTML = `
                <span><b>${item.date}</b> - ${item.emotion.name}</span>
                <span>${item.habit1 ? '✅' : '❌'} | ${item.habit2 ? '✅' : '❌'}</span>
            `;
            container.appendChild(div);
        });
    }

    // Sayfa açıldığında eski kayıtları göster
    renderLogs();
</script>

</body>
</html>
