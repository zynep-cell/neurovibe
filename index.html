<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVibe - Emotion Spectrum</title>
    <style>
        :root { --bg: #fdfbfb; --accent: #333; --gold: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; color: #444; }
        
        .container { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.06); width: 100%; max-width: 480px; text-align: center; position: relative; }

        /* Başlık Alanı */
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .profile-name { font-weight: bold; border: none; font-size: 1rem; color: var(--accent); outline: none; background: transparent; width: 150px; }

        /* Sanat Alanı */
        .canvas-container { position: relative; width: 260px; height: 260px; margin: 10px auto; border-radius: 50%; overflow: hidden; background: white; border: 4px solid #f9f9f9; box-shadow: inset 0 0 15px rgba(0,0,0,0.03); }
        canvas { cursor: crosshair; touch-action: none; }

        .draw-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0; }
        .tool-btn { padding: 6px 10px; border: none; border-radius: 8px; cursor: pointer; background: #eee; font-size: 11px; }
        .tool-btn.active { background: var(--accent); color: white; }

        /* Duygu Spektrumu (Yeni) */
        .emotion-selector { text-align: left; margin: 20px 0; background: #fcfcfc; padding: 15px; border-radius: 20px; border: 1px solid #f0f0f0; }
        .emotion-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .emo-btn { padding: 8px; border-radius: 12px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .emo-btn.active { border-color: var(--accent); background: #f0f0f0; font-weight: bold; }
        
        .intensity-row { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
        .intensity-values { display: flex; justify-content: space-between; color: #888; font-weight: bold; }

        /* Hava Durumu */
        .weather-grid { display: flex; justify-content: space-around; margin: 10px 0; font-size: 20px; }
        .weather-icon { cursor: pointer; padding: 5px; border-radius: 50%; }
        .weather-icon.active { background: #fff3cd; transform: scale(1.2); }

        /* Alışkanlıklar */
        .habit-manager { text-align: left; margin: 15px 0; }
        .habit-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .habit-chip { background: #f0f0f0; padding: 6px 12px; border-radius: 15px; font-size: 11px; cursor: pointer; }
        .habit-chip.active { background: #e8f5e9; border: 1px solid #4CAF50; }

        #save-btn { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 15px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }

        /* Galeri */
        .history { width: 100%; max-width: 480px; margin-top: 25px; }
        .log-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .log-card { background: white; padding: 10px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); text-align: center; position: relative; border: 1px solid #eee; }
        .log-card img { width: 100%; border-radius: 50%; margin-bottom: 5px; }
        .log-tag { font-size: 9px; padding: 2px 6px; background: #eee; border-radius: 10px; display: inline-block; }
        
        #celebration { position: absolute; top: -15px; left: 0; width: 100%; color: var(--gold); font-weight: bold; display: none; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="celebration">✨ HARİKASIN. DEVAM ET. ✨</div>
        
        <div class="header-row">
            <div>👋 <input type="text" id="userName" class="profile-name" placeholder="İsmin?"></div>
            <div id="clock" style="font-size: 12px; color: #aaa;"></div>
        </div>
        
        <div class="canvas-container">
            <canvas id="paintCanvas" width="260" height="260"></canvas>
        </div>

        <div class="draw-tools">
            <input type="color" id="colorPicker" value="#FFD700" style="width:30px; height:30px; border:none; background:none;">
            <input type="range" id="sizeRange" min="1" max="50" value="10" style="width:80px;">
            <button class="tool-btn active" id="btn-sulu" onclick="setTool('sulu')">Sulu</button>
            <button class="tool-btn" id="btn-murekkep" onclick="setTool('murekkep')">Mürek.</button>
            <button class="tool-btn" id="btn-kursun" onclick="setTool('kursun')">Kurşun</button>
            <button class="tool-btn" onclick="undo()">↩️</button>
            <button class="tool-btn" onclick="clearCanvas()">🗑️</button>
        </div>

        <!-- Duygu Spektrumu Seçici -->
        <div class="emotion-selector">
            <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:10px;">Şu Anki Modun:</label>
            <div class="emotion-grid">
                <button class="emo-btn" onclick="setEmotion('Mutlu')">😊 Mutlu</button>
                <button class="emo-btn" onclick="setEmotion('Huzurlu')">😌 Huzurlu</button>
                <button class="emo-btn" onclick="setEmotion('Öfkeli')">😠 Öfkeli</button>
                <button class="emo-btn" onclick="setEmotion('Kızgın')">😡 Kızgın</button>
                <button class="emo-btn" onclick="setEmotion('Sıkkın')">😑 Sıkkın</button>
                <button class="emo-btn" onclick="setEmotion('Nötr')">😐 Nötr</button>
            </div>
            <div class="intensity-row">
                <span>Hissiyat Yoğunluğu: <b id="intLabel">%50</b></span>
                <input type="range" id="intRange" min="0" max="100" step="25" value="50" oninput="document.getElementById('intLabel').innerText = '%' + this.value">
                <div class="intensity-values"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
            </div>
        </div>

        <div class="weather-grid">
            <span class="weather-icon" onclick="setWeather('sunny', '☀️')">☀️</span>
            <span class="weather-icon" onclick="setWeather('moon', '🌙')">🌙</span>
            <span class="weather-icon" onclick="setWeather('rainy', '🌧️')">🌧️</span>
            <span class="weather-icon" onclick="setWeather('windy', '🌬️')">🌬️</span>
        </div>

        <div class="habit-manager">
            <div id="habitList" class="habit-list"></div>
            <div style="display:flex; gap:5px; margin-top:8px;">
                <input type="text" id="newHabitInput" placeholder="Alışkanlık ekle..." style="flex:1; padding:8px; border-radius:10px; border:1px solid #eee; font-size:12px;">
                <button onclick="addNewHabit()" style="border:none; background:var(--accent); color:white; border-radius:10px; padding:0 15px; cursor:pointer;">+</button>
            </div>
        </div>

        <textarea id="note" maxlength="300" rows="2" placeholder="Notun (Opsiyonel)"></textarea>
        <button id="save-btn" onclick="saveData()">Günü Mühürle</button>
    </div>

    <div class="history">
        <h3 style="text-align:left; font-size:16px;">Sanatsal Zaman Tüneli</h3>
        <div id="logGrid" class="log-grid"></div>
    </div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let currentTool = 'sulu';
    let undoStack = [];
    let selectedEmotion = "Nötr";
    let selectedWeather = "✨";

    // Çizim Motoru
    function saveState() { if (undoStack.length > 20) undoStack.shift(); undoStack.push(canvas.toDataURL()); }
    function undo() { if (undoStack.length > 0) { let img = new Image(); img.src = undoStack.pop(); img.onload = () => { ctx.clearRect(0,0,260,260); ctx.drawImage(img,0,0); }; } }
    function clearCanvas() { saveState(); ctx.clearRect(0,0,260,260); }
    
    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        const color = document.getElementById('colorPicker').value;
        const size = document.getElementById('sizeRange').value;

        ctx.lineCap = 'round'; ctx.strokeStyle = color; ctx.lineWidth = size;

        if (currentTool === 'sulu') { ctx.globalAlpha = 0.1; ctx.lineWidth = size * 1.5; }
        else if (currentTool === 'murekkep') { ctx.globalAlpha = 0.8; ctx.lineWidth = size * 0.4; }
        else if (currentTool === 'kursun') { ctx.globalAlpha = 0.2; ctx.lineWidth = 2; }
        
        ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', (e) => { saveState(); painting = true; draw(e); });
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
    canvas.addEventListener('touchstart', (e) => { saveState(); painting = true; draw(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });
    canvas.addEventListener('touchend', () => { painting = false; ctx.beginPath(); });

    function setTool(t) {
        currentTool = t;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + t)?.classList.add('active');
    }

    // Duygu & Hava Durumu
    function setEmotion(emo) {
        selectedEmotion = emo;
        document.querySelectorAll('.emo-btn').forEach(b => {
            b.classList.toggle('active', b.innerText.includes(emo));
        });
    }

    function setWeather(type, icon) {
        selectedWeather = icon;
        document.querySelectorAll('.weather-icon').forEach(i => i.classList.toggle('active', i.innerText === icon));
    }

    // Alışkanlıklar
    let habits = JSON.parse(localStorage.getItem('neuro_habits')) || ["Lenf Vuruşları"];
    let activeHabits = [];

    function renderHabits() {
        const list = document.getElementById('habitList');
        list.innerHTML = "";
        habits.forEach((h, i) => {
            const div = document.createElement('div');
            div.className = `habit-chip ${activeHabits.includes(h) ? 'active' : ''}`;
            div.innerHTML = `${h} <span onclick="deleteHabit(event, ${i})" style="margin-left:5px; opacity:0.5">×</span>`;
            div.onclick = () => {
                if (activeHabits.includes(h)) activeHabits = activeHabits.filter(a => a !== h);
                else { activeHabits.push(h); showCelebration(); }
                renderHabits();
            };
            list.appendChild(div);
        });
    }

    function addNewHabit() {
        const val = document.getElementById('newHabitInput').value.trim();
        if (val && habits.length < 10) {
            habits.push(val);
            localStorage.setItem('neuro_habits', JSON.stringify(habits));
            document.getElementById('newHabitInput').value = "";
            renderHabits();
        }
    }

    function deleteHabit(e, index) {
        e.stopPropagation(); habits.splice(index, 1);
        localStorage.setItem('neuro_habits', JSON.stringify(habits));
        renderHabits();
    }

    function showCelebration() {
        const cel = document.getElementById('celebration');
        cel.style.display = 'block'; setTimeout(() => cel.style.display = 'none', 2000);
    }

    // Veri Saklama
    function saveData() {
        const intensity = document.getElementById('intRange').value;
        const entry = {
            id: Date.now(),
            user: document.getElementById('userName').value || "Gezgin",
            time: new Date().toLocaleDateString('tr-TR'),
            emotion: selectedEmotion,
            intensity: intensity,
            weather: selectedWeather,
            habits: [...activeHabits],
            image: canvas.toDataURL(),
            note: document.getElementById('note').value
        };
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        logs.unshift(entry);
        localStorage.setItem('neuro_logs', JSON.stringify(logs));
        
        renderLogs();
        clearCanvas();
        document.getElementById('note').value = "";
        activeHabits = []; renderHabits();
    }

    function renderLogs() {
        const grid = document.getElementById('logGrid');
        const logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        grid.innerHTML = "";
        logs.forEach(item => {
            const card = document.createElement('div');
            card.className = 'log-card';
            card.innerHTML = `
                <div onclick="deleteLog(${item.id})" style="position:absolute; top:5px; right:8px; color:#ddd; cursor:pointer;">×</div>
                <img src="${item.image}">
                <div style="font-size:10px; font-weight:bold;">${item.time} ${item.weather}</div>
                <div class="log-tag">${item.emotion} %${item.intensity}</div>
            `;
            grid.appendChild(card);
        });
    }

    function deleteLog(id) {
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        localStorage.setItem('neuro_logs', JSON.stringify(logs.filter(l => l.id !== id)));
        renderLogs();
    }

    // Init
    document.getElementById('userName').value = localStorage.getItem('neuro_username') || "";
    document.getElementById('userName').onchange = (e) => localStorage.setItem('neuro_username', e.target.value);
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}); }, 1000);
    renderHabits(); renderLogs();
</script>
</body>
</html>
