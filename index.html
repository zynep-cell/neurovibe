<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVibe - Personal Ecosystem</title>
    <style>
        :root { --bg: #fdfbfb; --accent: #333; --gold: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; color: #444; }
        
        .container { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.06); width: 100%; max-width: 460px; text-align: center; position: relative; }

        /* Profil Kısmı */
        .profile-area { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .profile-name { font-weight: bold; border: none; text-align: center; font-size: 1.1rem; color: var(--accent); outline: none; border-bottom: 1px dashed #ccc; }

        /* Kutlama Yazısı */
        #celebration { position: absolute; top: -15px; left: 0; width: 100%; color: var(--gold); font-weight: bold; font-size: 1.2rem; display: none; z-index: 100; animation: sparkle 0.8s infinite alternate; pointer-events: none; }
        @keyframes sparkle { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.1); opacity: 1; text-shadow: 0 0 10px rgba(212,175,55,0.4); } }

        /* Çizim Alanı */
        .canvas-container { position: relative; width: 280px; height: 280px; margin: 15px auto; border-radius: 50%; overflow: hidden; background: white; border: 4px solid #f9f9f9; box-shadow: inset 0 0 20px rgba(0,0,0,0.03); }
        canvas { cursor: crosshair; touch-action: none; }

        .draw-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 15px; }
        .tool-btn { padding: 8px 12px; border: none; border-radius: 10px; cursor: pointer; background: #f0f0f0; font-size: 12px; transition: 0.3s; }
        .tool-btn.active { background: var(--accent); color: white; }

        /* Stres Ölçeği */
        .stress-box { background: #fcfcfc; padding: 15px; border-radius: 20px; margin: 15px 0; border: 1px solid #f0f0f0; }
        #stressLabel { display: block; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--accent); }

        /* Alışkanlık Yönetimi */
        .habit-manager { text-align: left; margin: 20px 0; }
        .habit-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .habit-chip { background: #f0f0f0; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; position: relative; transition: 0.3s; }
        .habit-chip.active { background: #e8f5e9; border: 1px solid #4CAF50; color: #2e7d32; }
        .habit-chip .remove-habit { margin-left: 8px; color: #ff5252; font-weight: bold; font-size: 14px; vertical-align: middle; }

        .add-habit-box { display: flex; gap: 5px; }
        .add-habit-box input { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid #ddd; font-size: 13px; }

        textarea { width: 100%; border-radius: 15px; border: 1px solid #eee; padding: 15px; box-sizing: border-box; margin: 10px 0; font-family: inherit; font-size: 14px; background: #fafafa; }
        #save-btn { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 15px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; letter-spacing: 1px; }

        .log-item { background: white; padding: 20px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); text-align: left; position: relative; border-left: 6px solid var(--accent); }
        .delete-log { position: absolute; right: 15px; top: 15px; color: #ccc; cursor: pointer; font-size: 12px; }
        .log-header { font-size: 12px; color: #999; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="celebration">✨ HARİKASIN. DEVAM ET. ✨</div>
        
        <div class="profile-area">
             👋 <input type="text" id="userName" class="profile-name" placeholder="İsmin nedir?" onchange="saveProfile()">
        </div>
        
        <div class="canvas-container">
            <canvas id="paintCanvas" width="280" height="280"></canvas>
        </div>

        <div class="draw-tools">
            <input type="color" id="colorPicker" value="#FFD700" title="Renk Seç">
            <button class="tool-btn active" id="btn-sulu" onclick="setTool('sulu')">Sulu</button>
            <button class="tool-btn" id="btn-puskurtme" onclick="setTool('puskurtme')">Püskürtme</button>
            <button class="tool-btn" onclick="setTool('eraser')">Silgi</button>
            <button class="tool-btn" style="background:#ffdada" onclick="undo()">Geri Al</button>
            <button class="tool-btn" style="background:#eee" onclick="clearCanvas()">Sıfırla</button>
        </div>

        <div class="stress-box">
            <span id="stressLabel">Durumum: İyiyim (0)</span>
            <input type="range" id="stressRange" min="0" max="10" value="0" oninput="updateStress(this.value)">
        </div>

        <div class="habit-manager">
            <label style="font-size: 14px; font-weight: bold; margin-bottom: 10px; display: block;">Alışkanlık Takibim</label>
            <div id="habitList" class="habit-list"></div>
            <div class="add-habit-box" id="habitInputArea">
                <input type="text" id="newHabitInput" placeholder="Yeni alışkanlık (Örn: 🧘 Meditasyon)">
                <button onclick="addNewHabit()" class="tool-btn" style="background:var(--accent); color:white">+</button>
            </div>
        </div>

        <textarea id="note" maxlength="300" rows="2" placeholder="Bugünün nasıldı?"></textarea>
        <button id="save-btn" onclick="saveData()">Günü Mühürle</button>
    </div>

    <div id="history" style="width:100%; max-width:460px; margin-top:25px;"></div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let currentTool = 'sulu';
    let undoStack = [];

    // Profil Yönetimi
    function saveProfile() {
        localStorage.setItem('neuro_username', document.getElementById('userName').value);
    }
    document.getElementById('userName').value = localStorage.getItem('neuro_username') || "";

    // Çizim Motoru
    function saveState() {
        if (undoStack.length > 25) undoStack.shift();
        undoStack.push(canvas.toDataURL());
    }

    function undo() {
        if (undoStack.length > 0) {
            let img = new Image();
            img.src = undoStack.pop();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
        }
    }

    function clearCanvas() {
        saveState();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function startPosition(e) { saveState(); painting = true; draw(e); }
    function finishedPosition() { painting = false; ctx.beginPath(); }

    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        const color = document.getElementById('colorPicker').value;

        ctx.lineCap = 'round';
        if (currentTool === 'eraser') {
            ctx.globalAlpha = 1.0; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 30;
        } else if (currentTool === 'sulu') {
            ctx.globalAlpha = 0.15; ctx.strokeStyle = color; ctx.lineWidth = 25;
        } else if (currentTool === 'puskurtme') {
            ctx.fillStyle = color; ctx.globalAlpha = 0.4;
            for(let i=0; i<15; i++) {
                ctx.fillRect(x + (Math.random()-0.5)*35, y + (Math.random()-0.5)*35, 2, 2);
            }
            return;
        }
        ctx.lineTo(x, y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', finishedPosition);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startPosition);
    canvas.addEventListener('touchend', finishedPosition);
    canvas.addEventListener('touchmove', draw);

    function setTool(t) {
        currentTool = t;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        if(t !== 'eraser') document.getElementById('btn-' + t)?.classList.add('active');
    }

    // Stres Ölçeği (Güncellenmiş Sıralama)
    function updateStress(val) {
        let text = "";
        if (val == 0) text = "Harikayım/Sakinim";
        else if (val <= 2) text = "Ucundan stresli";
        else if (val <= 4) text = "Az stresli";
        else if (val == 5) text = "Nötr";
        else if (val <= 7) text = "Giderek artıyor";
        else if (val <= 9) text = "Stresliyim";
        else text = "WOW, Az Sakinleş!";
        document.getElementById('stressLabel').innerText = `Durumum: ${text} (${val})`;
    }

    // Alışkanlık Yönetimi
    let habits = JSON.parse(localStorage.getItem('neuro_habits')) || ["🦴 Lenf Vuruşları", "💧 Su"];
    let activeHabits = [];

    function renderHabits() {
        const list = document.getElementById('habitList');
        list.innerHTML = "";
        habits.forEach((h, index) => {
            const div = document.createElement('div');
            div.className = `habit-chip ${activeHabits.includes(h) ? 'active' : ''}`;
            div.innerHTML = `${h} <span class="remove-habit" onclick="removeHabit(event, ${index})">×</span>`;
            div.onclick = () => {
                if (activeHabits.includes(h)) activeHabits = activeHabits.filter(a => a !== h);
                else {
                    activeHabits.push(h);
                    showCelebration();
                }
                renderHabits();
            };
            list.appendChild(div);
        });
        document.getElementById('habitInputArea').style.display = habits.length >= 10 ? 'none' : 'flex';
    }

    function addNewHabit() {
        const val = document.getElementById('newHabitInput').value.trim();
        if (val && habits.length < 10) {
            habits.push(val);
            localStorage.setItem('neuro_habits', JSON.stringify(habits));
            document.getElementById('newHabitInput').value = "";
            renderHabits();
        }
    }

    function removeHabit(e, index) {
        e.stopPropagation();
        habits.splice(index, 1);
        localStorage.setItem('neuro_habits', JSON.stringify(habits));
        renderHabits();
    }

    function showCelebration() {
        const cel = document.getElementById('celebration');
        cel.style.display = 'block';
        setTimeout(() => cel.style.display = 'none', 2500);
    }

    // Kayıt Fonksiyonu
    function saveData() {
        const entry = {
            id: Date.now(),
            user: document.getElementById('userName').value || "Bilinmeyen",
            time: new Date().toLocaleString('tr-TR'),
            stress: document.getElementById('stressRange').value,
            note: document.getElementById('note').value,
            habits: [...activeHabits],
            image: canvas.toDataURL()
        };
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        logs.unshift(entry);
        localStorage.setItem('neuro_logs', JSON.stringify(logs));
        
        renderLogs();
        clearCanvas();
        document.getElementById('note').value = "";
        activeHabits = [];
        renderHabits();
    }

    function renderLogs() {
        const container = document.getElementById('history');
        const logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        container.innerHTML = "<h3>Zaman Tüneli</h3>";
        logs.forEach(item => {
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `
                <div class="delete-log" onclick="deleteLog(${item.id})">Sil</div>
                <div class="log-header">👤 ${item.user} | 🕒 ${item.time}</div>
                <strong>Stres: ${item.stress}/10</strong>
                <div style="margin:12px 0"><img src="${item.image}" width="75" style="border-radius:50%; border:2px solid #f0f0f0"></div>
                <div style="font-size:12px; color:#2e7d32">${item.habits.map(h => '✅ '+h).join(' ')}</div>
                ${item.note ? `<div style="margin-top:8px; font-size:13px; font-style:italic">"${item.note}"</div>` : ''}
            `;
            container.appendChild(div);
        });
    }

    function deleteLog(id) {
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        localStorage.setItem('neuro_logs', JSON.stringify(logs.filter(l => l.id !== id)));
        renderLogs();
    }

    renderHabits();
    renderLogs();
</script>
</body>
</html>
