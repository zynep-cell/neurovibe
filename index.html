<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVibe - Full Ecosystem</title>
    <style>
        :root { --bg: #fdfbfb; --accent: #333; --gold: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; color: #444; }
        
        .container { background: white; padding: 20px; border-radius: 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.06); width: 100%; max-width: 480px; text-align: center; position: relative; }

        /* Başlık */
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .profile-name { font-weight: bold; border: none; font-size: 1rem; color: var(--accent); outline: none; background: transparent; width: 150px; }

        /* Çizim Alanı */
        .canvas-container { position: relative; width: 260px; height: 260px; margin: 10px auto; border-radius: 50%; overflow: hidden; background: white; border: 4px solid #f9f9f9; box-shadow: inset 0 0 15px rgba(0,0,0,0.03); }
        canvas { cursor: crosshair; touch-action: none; }

        .draw-tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 10px 0; }
        .tool-btn { padding: 6px; border: none; border-radius: 8px; cursor: pointer; background: #f0f0f0; font-size: 11px; }
        .tool-btn.active { background: var(--accent); color: white; }

        /* Duygu Çizelgesi (Çoklu Seçim) */
        .emotion-selector { text-align: left; margin: 15px 0; background: #fcfcfc; padding: 12px; border-radius: 20px; border: 1px solid #f0f0f0; }
        .emotion-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .emo-btn { padding: 8px; border-radius: 10px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 11px; transition: 0.2s; }
        .emo-btn.selected { border-color: var(--accent); background: #e8f0fe; font-weight: bold; transform: scale(1.05); }

        /* Stres Seviyesi */
        .stress-box { margin: 15px 0; text-align: left; font-size: 13px; font-weight: bold; }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }

        /* Hava Durumu & Yazılar */
        .weather-grid { display: flex; justify-content: space-around; margin: 10px 0; font-size: 22px; }
        .weather-icon { cursor: pointer; padding: 5px; border-radius: 50%; transition: 0.3s; }
        .weather-icon.active { background: #fff3cd; transform: scale(1.2); }
        #weather-tip { font-size: 11px; color: var(--gold); font-style: italic; min-height: 15px; margin-bottom: 10px; }

        /* Alışkanlıklar */
        .habit-manager { text-align: left; margin: 15px 0; }
        .habit-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
        .habit-chip { background: #f0f0f0; padding: 5px 10px; border-radius: 15px; font-size: 11px; cursor: pointer; }
        .habit-chip.active { background: #e8f5e9; border: 1px solid #4CAF50; }

        #save-btn { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 15px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }

        #celebration { position: absolute; top: -15px; width: 100%; color: var(--gold); font-weight: bold; display: none; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="celebration">✨ HARİKASIN. DEVAM ET. ✨</div>
        <div class="header-row">
            <div>👋 <input type="text" id="userName" class="profile-name" placeholder="İsmin?"></div>
            <div id="clock" style="font-size: 12px; color: #aaa;"></div>
        </div>
        
        <div class="canvas-container"><canvas id="paintCanvas" width="260" height="260"></canvas></div>

        <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
            <input type="color" id="colorPicker" value="#FFD700">
            <input type="range" id="sizeRange" min="1" max="50" value="10">
        </div>

        <div class="draw-tools">
            <button class="tool-btn active" id="btn-sulu" onclick="setTool('sulu')">💧 Sulu</button>
            <button class="tool-btn" id="btn-puskurtme" onclick="setTool('puskurtme')">💨 Püskürt</button>
            <button class="tool-btn" id="btn-murekkep" onclick="setTool('murekkep')">🖋️ Mürek.</button>
            <button class="tool-btn" id="btn-kursun" onclick="setTool('kursun')">✏️ Kurşun</button>
            <button class="tool-btn" id="btn-eraser" onclick="setTool('eraser')">🧽 Silgi</button>
            <button class="tool-btn" onclick="undo()">↩️ Geri</button>
            <button class="tool-btn" onclick="clearCanvas()">🗑️ Sil</button>
        </div>

        <div class="weather-grid">
            <span class="weather-icon" onclick="setWeather('sunny', '☀️')">☀️</span>
            <span class="weather-icon" onclick="setWeather('cloudy', '⛅')">⛅</span>
            <span class="weather-icon" onclick="setWeather('moon', '🌙')">🌙</span>
            <span class="weather-icon" onclick="setWeather('rainy', '🌧️')">🌧️</span>
            <span class="weather-icon" onclick="setWeather('stormy', '⚡')">⚡</span>
            <span class="weather-icon" onclick="setWeather('windy', '🌬️')">🌬️</span>
        </div>
        <div id="weather-tip"></div>

        <div class="emotion-selector">
            <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:8px;">Bugünkü Modun (Birden fazla seçebilirsin):</label>
            <div class="emotion-grid">
                <button class="emo-btn" onclick="toggleEmotion('Mutlu')">😊 Mutlu</button>
                <button class="emo-btn" onclick="toggleEmotion('Huzurlu')">😌 Huzurlu</button>
                <button class="emo-btn" onclick="toggleEmotion('Öfkeli')">😠 Öfkeli</button>
                <button class="emo-btn" onclick="toggleEmotion('Kızgın')">😡 Kızgın</button>
                <button class="emo-btn" onclick="toggleEmotion('Sıkkın')">😑 Sıkkın</button>
                <button class="emo-btn" onclick="toggleEmotion('Nötr')">😐 Nötr</button>
            </div>
        </div>

        <div class="stress-box">
            <label id="stressLabel">Stres: Harikayım (0)</label>
            <input type="range" id="stressRange" min="0" max="10" value="0" oninput="updateStress(this.value)">
        </div>

        <div class="habit-manager">
            <div id="habitList" class="habit-list"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="newHabitInput" placeholder="Alışkanlık..." style="flex:1; border-radius:10px; border:1px solid #eee; padding:8px;">
                <button onclick="addNewHabit()" style="background:var(--accent); color:white; border-radius:10px; border:none; padding:0 10px;">+</button>
            </div>
        </div>

        <textarea id="note" rows="2" placeholder="Notların..."></textarea>
        <button id="save-btn" onclick="saveData()">Günü Mühürle</button>
    </div>

    <div id="history" style="width:100%; max-width:480px; margin-top:20px; display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:10px;"></div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false; let currentTool = 'sulu'; let undoStack = [];
    let selectedEmotions = []; let selectedWeather = "";

    function saveState() { if (undoStack.length > 20) undoStack.shift(); undoStack.push(canvas.toDataURL()); }
    function undo() { if (undoStack.length > 0) { let img = new Image(); img.src = undoStack.pop(); img.onload = () => { ctx.clearRect(0,0,260,260); ctx.drawImage(img,0,0); }; } }
    function clearCanvas() { saveState(); ctx.clearRect(0,0,260,260); }

    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        const color = document.getElementById('colorPicker').value;
        const size = document.getElementById('sizeRange').value;
        ctx.lineCap = 'round'; ctx.strokeStyle = color; ctx.lineWidth = size;
        if (currentTool === 'eraser') { ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = 30; }
        else if (currentTool === 'sulu') { ctx.globalAlpha = 0.1; ctx.lineWidth = size * 1.5; }
        else if (currentTool === 'puskurtme') {
            ctx.fillStyle = color; ctx.globalAlpha = 0.3;
            for(let i=0; i<10; i++) ctx.fillRect(x + (Math.random()-0.5)*size, y + (Math.random()-0.5)*size, 2, 2); return;
        }
        ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', (e) => { saveState(); painting = true; draw(e); });
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
    canvas.addEventListener('touchstart', (e) => { saveState(); painting = true; draw(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });

    function setTool(t) { currentTool = t; document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+t)?.classList.add('active'); }

    const tips = { sunny: "Güneş kremini unutma, D vitamini al! ☀️", cloudy: "Hava yumuşak, biraz D vitamini hala orada! ⛅", moon: "Gökyüzüne, yıldızlara bakmayı unutma... 🌙", rainy: "Şemsiye kullan ve yağmur sesiyle sakinleş. 🌧️", stormy: "Unutma, her fırtına sonrası hava sakinleşir. ⚡", windy: "Kendini editteymiş gibi hayal et ;) 🌬️" };
    function setWeather(type, icon) { selectedWeather = icon; document.querySelectorAll('.weather-icon').forEach(i => i.classList.toggle('active', i.innerText === icon)); document.getElementById('weather-tip').innerText = tips[type]; }

    function toggleEmotion(emo) {
        if(selectedEmotions.includes(emo)) selectedEmotions = selectedEmotions.filter(e => e !== emo);
        else selectedEmotions.push(emo);
        document.querySelectorAll('.emo-btn').forEach(b => b.classList.toggle('selected', selectedEmotions.includes(b.innerText.split(' ')[1])));
    }

    function updateStress(val) {
        let texts = ["Harikayım", "Ucundan stresli", "Ucundan stresli", "Az stresli", "Az stresli", "Nötr", "Giderek artıyor", "Giderek artıyor", "Stresliyim", "Stresliyim", "WOW, Az Sakinleş!"];
        document.getElementById('stressLabel').innerText = `Stres: ${texts[val]} (${val})`;
    }

    let habits = JSON.parse(localStorage.getItem('neuro_habits')) || ["Lenf Vuruşları"];
    let activeHabits = [];
    function renderHabits() {
        const list = document.getElementById('habitList'); list.innerHTML = "";
        habits.forEach((h, i) => {
            const div = document.createElement('div'); div.className = `habit-chip ${activeHabits.includes(h) ? 'active' : ''}`;
            div.innerHTML = `${h} <span onclick="deleteHabit(event, ${i})">×</span>`;
            div.onclick = () => { if(activeHabits.includes(h)) activeHabits = activeHabits.filter(a => a !== h); else { activeHabits.push(h); document.getElementById('celebration').style.display='block'; setTimeout(()=>document.getElementById('celebration').style.display='none', 2000); } renderHabits(); };
            list.appendChild(div);
        });
    }
    function addNewHabit() { const v = document.getElementById('newHabitInput').value; if(v) { habits.push(v); localStorage.setItem('neuro_habits', JSON.stringify(habits)); renderHabits(); } }
    function deleteHabit(e, i) { e.stopPropagation(); habits.splice(i,1); localStorage.setItem('neuro_habits', JSON.stringify(habits)); renderHabits(); }

    function saveData() {
        const entry = { id: Date.now(), user: document.getElementById('userName').value, time: new Date().toLocaleDateString('tr-TR'), emotions: [...selectedEmotions], stress: document.getElementById('stressRange').value, weather: selectedWeather, habits: [...activeHabits], image: canvas.toDataURL(), note: document.getElementById('note').value };
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || []; logs.unshift(entry); localStorage.setItem('neuro_logs', JSON.stringify(logs));
        renderLogs(); clearCanvas(); selectedEmotions = []; activeHabits = []; renderHabits();
    }

    function renderLogs() {
        const hist = document.getElementById('history'); hist.innerHTML = "";
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        logs.forEach(l => {
            const d = document.createElement('div'); d.style = "background:white; padding:10px; border-radius:15px; text-align:center; position:relative; box-shadow:0 2px 5px rgba(0,0,0,0.05)";
            d.innerHTML = `<img src="${l.image}" width="100%"><div style="font-size:9px">${l.time} ${l.weather}</div><div style="font-size:10px; font-weight:bold">${l.emotions.join(', ')}</div><div onclick="deleteLog(${l.id})" style="position:absolute; top:5px; right:5px; cursor:pointer; color:#ccc">×</div>`;
            hist.appendChild(d);
        });
    }
    function deleteLog(id) { let logs = JSON.parse(localStorage.getItem('neuro_logs')) || []; localStorage.setItem('neuro_logs', JSON.stringify(logs.filter(l => l.id !== id))); renderLogs(); }

    document.getElementById('userName').value = localStorage.getItem('neuro_username') || "";
    document.getElementById('userName').onchange = (e) => localStorage.setItem('neuro_username', e.target.value);
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}); }, 1000);
    renderHabits(); renderLogs();
</script>
</body>
</html>
