<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVibe - Memory & Art Ecosystem</title>
    <style>
        :root { --bg: #fdfbfb; --accent: #333; --gold: #d4af37; --breath: #87CEEB; --eye: #FF6B6B; --music: #a29bfe; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; color: #444; }
        .container { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.06); width: 100%; max-width: 500px; text-align: center; position: relative; }

        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .stats-row { display: flex; justify-content: space-around; margin: 10px 0; background: #fafafa; padding: 12px; border-radius: 15px; font-size: 11px; border: 1px solid #f0f0f0; }
        .stat-box b { display: block; font-size: 16px; color: var(--accent); }

        /* Çizim Tuvali */
        .canvas-container { position: relative; width: 260px; height: 260px; margin: 10px auto; border-radius: 50%; overflow: hidden; background: white; border: 4px solid #f9f9f9; box-shadow: inset 0 0 15px rgba(0,0,0,0.03); }
        canvas { cursor: crosshair; touch-action: none; }
        .draw-tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 10px 0; }
        .tool-btn { padding: 8px; border: none; border-radius: 8px; cursor: pointer; background: #f0f0f0; font-size: 11px; }
        .tool-btn.active { background: var(--accent); color: white; }

        /* Nefes & Göz */
        .exercise-box { padding: 15px; border-radius: 25px; margin: 10px 0; border: 1px solid; position: relative; }
        #breath-circle { width: 50px; height: 50px; background: var(--breath); border-radius: 50%; margin: 10px auto; display: flex; align-items: center; justify-content: center; transition: transform 1s ease-in-out; opacity: 0.7; }
        #eye-canvas-box { width: 100%; height: 80px; background: white; border-radius: 15px; position: relative; overflow: hidden; border: 1px solid #eee; margin: 10px 0; }
        #eye-dot { width: 12px; height: 12px; background: var(--eye); border-radius: 50%; position: absolute; display: none; }

        /* Yeni: Günün Şarkısı ve Fotoğrafı */
        .memory-section { background: #fcfcfc; padding: 15px; border-radius: 20px; border: 1px solid #eee; margin: 15px 0; text-align: left; }
        .memory-input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 10px; border: 1px solid #eee; font-size: 13px; box-sizing: border-box; }
        .photo-upload-label { display: block; background: #eee; padding: 10px; border-radius: 10px; text-align: center; font-size: 12px; cursor: pointer; margin-top: 5px; }
        #photo-preview { width: 100%; border-radius: 10px; margin-top: 10px; display: none; }

        /* Diğer Modüller */
        .weather-grid { display: flex; justify-content: space-around; margin: 15px 0; font-size: 22px; }
        .weather-icon { cursor: pointer; padding: 5px; border-radius: 50%; }
        .weather-icon.active { background: #fff3cd; transform: scale(1.2); }
        #weather-tip { font-size: 11px; color: var(--gold); font-style: italic; min-height: 15px; }

        .emotion-section { text-align: left; background: #fcfcfc; padding: 12px; border-radius: 20px; border: 1px solid #eee; margin: 15px 0; }
        .emo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; padding: 5px; border-radius: 8px; }
        .emo-row.selected { background: #e8f0fe; }
        .emo-slider { flex: 1; accent-color: var(--accent); cursor: pointer; }

        .habit-manager { text-align: left; margin: 15px 0; }
        .habit-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; justify-content: center; }
        .habit-chip { background: #f0f0f0; padding: 5px 12px; border-radius: 15px; font-size: 11px; cursor: pointer; }
        .habit-chip.active { background: #e8f5e9; border-color: #4CAF50; color: #2e7d32; border: 1px solid; }

        textarea { width: 100%; border-radius: 15px; border: 1px solid #eee; padding: 15px; box-sizing: border-box; margin: 10px 0; font-family: inherit; font-size: 14px; min-height: 100px; }
        #save-btn { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 15px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }

        /* Zaman Tüneli */
        .log-card { background: white; padding: 15px; border-radius: 25px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); text-align: left; border-left: 8px solid var(--accent); position: relative; overflow: hidden; }
        .log-img-canvas { width: 70px; height: 70px; border-radius: 50%; float: right; border: 1px solid #eee; }
        .log-photo-memory { width: 100%; border-radius: 15px; margin-top: 10px; }
        .log-song { background: #f3f0ff; color: var(--music); padding: 5px 10px; border-radius: 10px; font-size: 11px; display: inline-block; margin-top: 5px; font-weight: bold; }
        .log-note { font-size: 12px; color: #666; background: #f9f9f9; padding: 8px; border-radius: 8px; margin-top: 10px; white-space: pre-wrap; }

        #celebration { position: absolute; top: -15px; width: 100%; color: var(--gold); font-weight: bold; display: none; text-align: center; z-index: 100; animation: bounce 0.5s infinite alternate; }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="celebration">✨ HARİKASIN. DEVAM ET. ✨</div>
        <div class="header-row">
            <div>👋 <input type="text" id="userName" style="border:none; outline:none; font-weight:bold; background:transparent; width:120px;" placeholder="İsmin?"></div>
            <div id="clock" style="font-size: 12px; color: #999; font-weight:bold;"></div>
        </div>

        <div class="stats-row">
            <div class="stat-box"><b id="stat-count">0</b>Mühür</div>
            <div class="stat-box"><b id="stat-stress">0</b>Ort. Stres</div>
            <div class="stat-box"><b id="stat-habits">0%</b>Başarı</div>
        </div>

        <div class="canvas-container"><canvas id="paintCanvas" width="260" height="260"></canvas></div>

        <div class="draw-tools">
            <input type="color" id="colorPicker" value="#FFD700" style="width:100%; grid-column: span 4; height:25px; border:none; background:none; cursor:pointer;">
            <input type="range" id="sizeRange" min="1" max="60" value="15" style="width:100%; grid-column: span 4; accent-color:#333;">
            <button class="tool-btn active" id="btn-sulu" onclick="setTool('sulu')">💧 Sulu</button>
            <button class="tool-btn" id="btn-puskurtme" onclick="setTool('puskurtme')">💨 Püskürt</button>
            <button class="tool-btn" id="btn-murekkep" onclick="setTool('murekkep')">🖋️ Mürek.</button>
            <button class="tool-btn" id="btn-kursun" onclick="setTool('kursun')">✏️ Kurşun</button>
            <button class="tool-btn" id="btn-eraser" onclick="setTool('eraser')">🧽 Silgi</button>
            <button class="tool-btn" onclick="undo()">↩️ Geri</button>
            <button class="tool-btn" onclick="clearCanvas()" style="background:#ddd">🗑️ Sıfırla</button>
        </div>

        <div class="breath-section exercise-box" style="background: #f0f8ff; border-color: #d0e4f5;">
            <div id="global-timer" style="position:absolute; top:5px; right:15px; font-size:10px; color:#4682B4;">60s</div>
            <div id="breath-instruction">Nefes Hazır mı?</div>
            <div id="breath-circle"><span id="sec-counter" style="color:white; font-weight:bold;">0</span></div>
            <button class="tool-btn" id="breathBtn" onclick="startBreathing()" style="background:var(--breath); color:white; width:auto; padding:5px 15px; border-radius:10px;">Nefesi Başlat</button>
        </div>

        <div class="eye-section exercise-box" style="background: #fff5f5; border-color: #fed7d7;">
            <div id="eye-instruction" style="font-weight:bold; color:var(--eye); font-size:12px;">Göz Egzersizi</div>
            <div id="eye-canvas-box"><div id="eye-dot"></div></div>
            <button class="tool-btn" id="eyeBtn" onclick="startEyeExercise()" style="background:var(--eye); color:white; width:auto; padding:5px 15px; border-radius:10px;">Gözü Başlat</button>
        </div>

        <!-- Yeni: Multimedya Anı Bölümü -->
        <div class="memory-section">
            <label style="font-size: 13px; font-weight: bold; color: var(--music);">🎵 Günün Şarkısı</label>
            <input type="text" id="songInput" class="memory-input" placeholder="Hangi şarkı seni anlatıyor?">
            
            <label style="font-size: 13px; font-weight: bold; color: var(--eye); margin-top:10px; display:block;">📸 Anı Fotoğrafı</label>
            <label for="photoInput" class="photo-upload-label">Fotoğraf Seç veya Çek</label>
            <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="previewPhoto(this)">
            <img id="photo-preview" src="">
        </div>

        <div class="weather-grid">
            <span class="weather-icon" onclick="setWeather('sunny','☀️')">☀️</span>
            <span class="weather-icon" onclick="setWeather('cloudy','⛅')">⛅</span>
            <span class="weather-icon" onclick="setWeather('moon','🌙')">🌙</span>
            <span class="weather-icon" onclick="setWeather('rainy','🌧️')">🌧️</span>
            <span class="weather-icon" onclick="setWeather('stormy','⚡')">⚡</span>
            <span class="weather-icon" onclick="setWeather('windy','🌬️')">🌬️</span>
        </div>
        <div id="weather-tip"></div>

        <div class="emotion-section">
            <div id="emo-container">
                <div class="emo-row" id="r-Mutlu"><span onclick="toggleEmo('Mutlu')" style="cursor:pointer">😊 Mutlu</span> <input type="range" class="emo-slider" oninput="updateEmo('Mutlu',this.value)" value="50"> <small id="v-Mutlu">%50</small></div>
                <div class="emo-row" id="r-Huzurlu"><span onclick="toggleEmo('Huzurlu')" style="cursor:pointer">😌 Huzurlu</span> <input type="range" class="emo-slider" oninput="updateEmo('Huzurlu',this.value)" value="50"> <small id="v-Huzurlu">%50</small></div>
                <div class="emo-row" id="r-Öfkeli"><span onclick="toggleEmo('Öfkeli')" style="cursor:pointer">😠 Öfkeli</span> <input type="range" class="emo-slider" oninput="updateEmo('Öfkeli',this.value)" value="50"> <small id="v-Öfkeli">%50</small></div>
                <div class="emo-row" id="r-Kızgın"><span onclick="toggleEmo('Kızgın')" style="cursor:pointer">😡 Kızgın</span> <input type="range" class="emo-slider" oninput="updateEmo('Kızgın',this.value)" value="50"> <small id="v-Kızgın">%50</small></div>
                <div class="emo-row" id="r-Sıkkın"><span onclick="toggleEmo('Sıkkın')" style="cursor:pointer">😑 Sıkkın</span> <input type="range" class="emo-slider" oninput="updateEmo('Sıkkın',this.value)" value="50"> <small id="v-Sıkkın">%50</small></div>
                <div class="emo-row" id="r-Nötr"><span onclick="toggleEmo('Nötr')" style="cursor:pointer">😐 Nötr</span> <input type="range" class="emo-slider" oninput="updateEmo('Nötr',this.value)" value="50"> <small id="v-Nötr">%50</small></div>
            </div>
        </div>

        <div style="text-align:left; font-size:12px; font-weight:bold;">
            Stres: <span id="stressLabel">Harikayım (0)</span>
            <input type="range" id="stressRange" min="0" max="10" value="0" oninput="updateStress(this.value)" style="width:100%; accent-color:#333;">
        </div>

        <div class="habit-manager">
            <div id="habitList" class="habit-list"></div>
            <div style="display:flex; gap:5px;"><input type="text" id="newHabitInput" placeholder="Alışkanlık ekle..."> <button onclick="addNewHabit()" style="background:var(--accent); color:white; border:none; border-radius:10px; padding:0 10px;">+</button></div>
        </div>

        <textarea id="note" maxlength="2000" placeholder="Bugünün notu (Maks 2000 karakter)..."></textarea>
        <button id="save-btn" onclick="saveData()">Günü Mühürle</button>
    </div>
    <div id="logHistory" style="width:100%; max-width:500px; margin-top:20px;"></div>

<script>
    const canvas = document.getElementById('paintCanvas'); const ctx = canvas.getContext('2d');
    let painting = false; let currentTool = 'sulu'; let undoStack = [];
    let activeEmos = {}; let selectedWeather = "✨"; let breathDone = false; let eyeDone = false;
    let base64Photo = "";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTick(f, d) { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.05, audioCtx.currentTime); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); }

    function saveState() { if(undoStack.length>25) undoStack.shift(); undoStack.push(canvas.toDataURL()); }
    function undo() { if(undoStack.length>0) { let img=new Image(); img.src=undoStack.pop(); img.onload=()=> { ctx.clearRect(0,0,260,260); ctx.drawImage(img,0,0); } } }
    function clearCanvas() { saveState(); ctx.clearRect(0,0,260,260); }
    function draw(e) {
        if(!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        const color = document.getElementById('colorPicker').value;
        const size = document.getElementById('sizeRange').value;
        ctx.lineCap='round'; ctx.strokeStyle=color; ctx.lineWidth=size;
        if(currentTool==='eraser') { ctx.strokeStyle='#fff'; ctx.lineWidth=35; ctx.globalAlpha=1; }
        else if(currentTool==='sulu') ctx.globalAlpha=0.1;
        else if(currentTool==='murekkep') { ctx.globalAlpha=0.8; ctx.lineWidth=size*0.4; }
        else if(currentTool==='kursun') { ctx.globalAlpha=0.3; ctx.lineWidth=1.5; }
        else if(currentTool==='puskurtme') { ctx.fillStyle=color; ctx.globalAlpha=0.3; for(let i=0;i<12;i++) ctx.fillRect(x+(Math.random()-0.5)*size, y+(Math.random()-0.5)*size, 2, 2); return; }
        ctx.lineTo(x,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y);
    }
    canvas.addEventListener('mousedown', (e)=>{ saveState(); painting=true; draw(e); });
    canvas.addEventListener('mousemove', draw); window.addEventListener('mouseup', ()=>{ painting=false; ctx.beginPath(); });
    canvas.addEventListener('touchstart', (e)=>{ saveState(); painting=true; draw(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e)=>{ draw(e); e.preventDefault(); });

    function setTool(t) { currentTool=t; document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active')); document.getElementById('btn-'+t)?.classList.add('active'); }

    // Fotoğraf Önizleme
    function previewPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('photo-preview').src = e.target.result;
                document.getElementById('photo-preview').style.display = 'block';
                base64Photo = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function startBreathing() {
        const inst=document.getElementById('breath-instruction'); const circle=document.getElementById('breath-circle'); const counter=document.getElementById('sec-counter'); const globalT=document.getElementById('global-timer');
        let timeLeft=60; const timer=setInterval(()=>{ timeLeft--; globalT.innerText=`${timeLeft}s`; if(timeLeft<=0) clearInterval(timer); },1000);
        while(timeLeft>0) {
            inst.innerText="NEFES AL"; circle.style.transform="scale(2.5)"; for(let s=4;s>0;s--){ counter.innerText=s; playTick(440,0.05); await new Promise(r=>setTimeout(r,1000)); if(timeLeft<=0) break;}
            inst.innerText="TUT"; for(let s=7;s>0;s--){ counter.innerText=s; playTick(554,0.05); await new Promise(r=>setTimeout(r,1000)); if(timeLeft<=0) break;}
            inst.innerText="VER"; circle.style.transform="scale(1)"; for(let s=8;s>0;s--){ counter.innerText=s; playTick(330,0.05); await new Promise(r=>setTimeout(r,1000)); if(timeLeft<=0) break;}
        }
        inst.innerText="Harika!"; counter.innerText="✓"; breathDone=true; showCel();
    }

    async function startEyeExercise() {
        const dot=document.getElementById('eye-dot'); const inst=document.getElementById('eye-instruction'); dot.style.display='block';
        const move = (s,e,d) => new Promise(res => { let st=null; const f=(t)=>{ if(!st) st=t; let p=Math.min((t-st)/d,1); dot.style.left=(s.x+(e.x-s.x)*p)+'%'; dot.style.top=(s.y+(e.y-s.y)*p)+'%'; if(p<1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
        inst.innerText="Takip Et..."; await move({x:0,y:0},{x:90,y:85},8000); await move({x:90,y:85},{x:0,y:0},8000);
        inst.innerText="Zigzag..."; for(let i=0;i<4;i++){ await move({x:5,y:0},{x:5,y:85},2000); await move({x:5,y:85},{x:5,y:0},2000); }
        dot.style.display='none'; eyeDone=true; showCel();
    }

    const tips = { sunny: "Güneş kremini unutma! ☀️", cloudy: "Hava yumuşak ⛅", moon: "Yıldızlara bak 🌙", rainy: "Yağmur Sesiyle Sakinleş 🌧️", stormy: "Fırtına Geçecek ⚡", windy: "Rüzgarla Akışta Kal ;) 🌬️" };
    function setWeather(t,i) { selectedWeather=i; document.querySelectorAll('.weather-icon').forEach(v=>v.classList.toggle('active',v.innerText===i)); document.getElementById('weather-tip').innerText=tips[t]; }
    function toggleEmo(e) { const r=document.getElementById('r-'+e); if(activeEmos[e]){ delete activeEmos[e]; r.classList.remove('selected'); } else { activeEmos[e]=50; r.classList.add('selected'); } }
    function updateEmo(e,v) { activeEmos[e]=v; document.getElementById('v-'+e).innerText='%'+v; }
    function updateStress(v) { document.getElementById('stressLabel').innerText=`Stres (${v})`; }
    function showCel() { const c=document.getElementById('celebration'); c.style.display='block'; setTimeout(()=>c.style.display='none',3000); }

    let habits = JSON.parse(localStorage.getItem('neuro_habits')) || ["Lenf Vuruşları"]; let activeHabits=[];
    function renderHabits() {
        const l=document.getElementById('habitList'); l.innerHTML="";
        habits.forEach((h,i)=>{ const d=document.createElement('div'); d.className=`habit-chip ${activeHabits.includes(h)?'active' :''}`; d.innerHTML=`${h} <span onclick="deleteHabit(event,${i})">×</span>`; d.onclick=()=>{ if(activeHabits.includes(h)) activeHabits=activeHabits.filter(a=>a!==h); else { activeHabits.push(h); showCel(); } renderHabits(); }; l.appendChild(d); });
    }
    function addNewHabit() { const v=document.getElementById('newHabitInput').value; if(v){ habits.push(v); localStorage.setItem('neuro_habits',JSON.stringify(habits)); renderHabits(); } }
    function deleteHabit(e,i) { e.stopPropagation(); habits.splice(i,1); localStorage.setItem('neuro_habits',JSON.stringify(habits)); renderHabits(); }

    function updateStats() {
        const logs=JSON.parse(localStorage.getItem('neuro_logs'))||[]; document.getElementById('stat-count').innerText=logs.length;
        if(logs.length>0){ 
            const avg=logs.reduce((a,c)=>a+parseInt(c.stress||0),0)/logs.length; document.getElementById('stat-stress').innerText=avg.toFixed(1); 
            const success = logs.filter(l => l.habits && l.habits.length > 0).length;
            document.getElementById('stat-habits').innerText = Math.round((success/logs.length)*100) + "%";
        }
    }

    function saveData() {
        const fh = [...activeHabits]; if(breathDone) fh.push("🧘 Nefes"); if(eyeDone) fh.push("👁️ Göz");
        const entry={ 
            id:Date.now(), 
            time:new Date().toLocaleString('tr-TR'), 
            hour:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),
            stress:document.getElementById('stressRange').value, 
            weather:selectedWeather, 
            note:document.getElementById('note').value, 
            image:canvas.toDataURL(), 
            habits:fh, 
            emos:{...activeEmos},
            song: document.getElementById('songInput').value,
            photo: base64Photo
        };
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || []; logs.unshift(entry); localStorage.setItem('neuro_logs',JSON.stringify(logs));
        renderLogs(); updateStats(); clearCanvas(); activeHabits=[]; breathDone=false; eyeDone=false; 
        document.getElementById('note').value = ""; document.getElementById('songInput').value = "";
        document.getElementById('photoInput').value = ""; document.getElementById('photo-preview').style.display = "none";
        base64Photo = ""; renderHabits();
    }

    function renderLogs() {
        const g=document.getElementById('logHistory'); g.innerHTML="<h3>Zaman Tüneli</h3>";
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        logs.forEach(l=>{
            const card=document.createElement('div'); card.className="log-card";
            const emTxt = Object.entries(l.emos).map(([k,v])=>`${k}(%${v})`).join(', ');
            card.innerHTML=`
                <div onclick="deleteLog(${l.id})" style="position:absolute;top:10px;right:10px;cursor:pointer;color:#ccc; font-weight:bold; font-size:16px;">×</div>
                <img src="${l.image}" class="log-img-canvas">
                <b>${l.time} ${l.hour} ${l.weather}</b><br>
                <small>Stres:${l.stress}/10 | ${l.habits.join(', ')}</small><br>
                <small>Mod: ${emTxt}</small>
                ${l.song ? `<div class="log-song">♫ ${l.song}</div>` : ''}
                ${l.photo ? `<img src="${l.photo}" class="log-photo-memory">` : ''}
                <div class="log-note">${l.note}</div>
            `;
            g.appendChild(card);
        });
    }
    function deleteLog(id){ let l=JSON.parse(localStorage.getItem('neuro_logs')); localStorage.setItem('neuro_logs',JSON.stringify(l.filter(x=>x.id!==id))); renderLogs(); updateStats(); }

    document.getElementById('userName').value=localStorage.getItem('neuro_username')||"";
    document.getElementById('userName').onchange=(e)=>localStorage.setItem('neuro_username',e.target.value);
    setInterval(()=>document.getElementById('clock').innerText=new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}),1000);
    renderHabits(); renderLogs(); updateStats();
</script>
</body>
</html>
