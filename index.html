 <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVibe - Personal Ecosystem</title>
    <style>
        :root { --bg: #f4f7f6; --accent: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .container { background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); width: 100%; max-width: 450px; text-align: center; }

        /* Çizim Alanı */
        .canvas-container { position: relative; width: 280px; height: 280px; margin: 10px auto; border-radius: 50%; overflow: hidden; background: white; border: 3px solid #eee; }
        canvas { cursor: crosshair; touch-action: none; }

        .draw-tools { display: flex; justify-content: center; gap: 8px; margin: 10px 0; }
        .tool-btn { padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; background: #eee; font-size: 12px; }
        .tool-btn.active { background: var(--accent); color: white; }

        /* Stres Ölçeği */
        .stress-slider { margin: 20px 0; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 15px; }
        #stressValue { font-weight: bold; float: right; }
        input[type=range] { width: 100%; cursor: pointer; }

        /* Alışkanlık Yönetimi */
        .habit-section { text-align: left; margin: 20px 0; }
        .habit-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .habit-chip { background: #eee; padding: 8px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .habit-chip.active { background: #98FB98; border: 1px solid #4CAF50; }
        .add-habit-box { display: flex; gap: 5px; margin-top: 10px; }
        .add-habit-box input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #ddd; }

        textarea { width: 100%; border-radius: 12px; border: 1px solid #ddd; padding: 12px; box-sizing: border-box; margin: 10px 0; font-family: inherit; }
        #save-btn { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }

        .log-item { background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); text-align: left; position: relative; border-left: 5px solid #333; }
        .delete-btn { position: absolute; right: 15px; top: 15px; color: red; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>NeuroVibe</h2>
        
        <div class="canvas-container">
            <canvas id="paintCanvas" width="280" height="280"></canvas>
        </div>

        <div class="draw-tools">
            <input type="color" id="colorPicker" value="#FFD700" title="Renk Seç">
            <button class="tool-btn active" onclick="setTool('sulu')">Sulu</button>
            <button class="tool-btn" onclick="setTool('puskurtme')">Püskürtme</button>
            <button class="tool-btn" onclick="setTool('eraser')">Silgi</button>
            <button class="tool-btn" style="background:#ffcccc" onclick="undo()">Geri Al</button>
            <button class="tool-btn" style="background:#ddd" onclick="clearCanvas()">Temizle</button>
        </div>

        <div class="stress-slider">
            <label>Stres Seviyesi: <span id="stressLabel">Nötr (5)</span></label>
            <input type="range" id="stressRange" min="0" max="10" value="5" oninput="updateStress(this.value)">
        </div>

        <div class="habit-section">
            <label><b>Alışkanlıklarım (Max 10)</b></label>
            <div id="habitList" class="habit-list"></div>
            <div class="add-habit-box" id="addHabitArea">
                <input type="text" id="newHabitName" placeholder="Örn: 🧘 Meditasyon">
                <button onclick="addNewHabit()" class="tool-btn">+</button>
            </div>
        </div>

        <textarea id="note" maxlength="300" rows="2" placeholder="Bugünün nasıldı?"></textarea>
        <button id="save-btn" onclick="saveData()">Günü Mühürle</button>
    </div>

    <div id="history" style="width:100%; max-width:450px; margin-top:20px;"></div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let currentTool = 'sulu';
    let undoStack = [];

    // Çizim Fonksiyonları
    function saveState() {
        if (undoStack.length > 20) undoStack.shift();
        undoStack.push(canvas.toDataURL());
    }

    function undo() {
        if (undoStack.length > 0) {
            let img = new Image();
            img.src = undoStack.pop();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
        }
    }

    function clearCanvas() {
        saveState();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function startPosition(e) { 
        saveState();
        painting = true; 
        draw(e); 
    }

    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        const color = document.getElementById('colorPicker').value;

        ctx.lineCap = 'round';
        if (currentTool === 'eraser') {
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 30;
        } else if (currentTool === 'sulu') {
            ctx.globalAlpha = 0.1;
            ctx.strokeStyle = color;
            ctx.lineWidth = 20;
        } else if (currentTool === 'puskurtme') {
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.4;
            for(let i=0; i<15; i++) {
                ctx.fillRect(x + (Math.random()-0.5)*30, y + (Math.random()-0.5)*30, 2, 2);
            }
            return;
        }
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startPosition);
    canvas.addEventListener('touchend', () => { painting = false; ctx.beginPath(); });
    canvas.addEventListener('touchmove', draw);

    function setTool(t) { 
        currentTool = t; 
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    }

    // Stres Ölçeği
    function updateStress(val) {
        let text = "";
        if (val <= 2) text = "Şiddetli Stres (0-2)";
        else if (val <= 4) text = "Stresli (3-4)";
        else if (val <= 5) text = "Nötr (5)";
        else if (val <= 7) text = "İdare Eder (6-7)";
        else text = "İyi & Stressiz (8-10)";
        document.getElementById('stressLabel').innerText = `${text} (${val})`;
    }

    // Alışkanlık Yönetimi
    let habits = JSON.parse(localStorage.getItem('my_habits')) || ["💧 Su İçmek", "🦴 Lenf Vuruşları"];
    let activeHabits = [];

    function renderHabits() {
        const list = document.getElementById('habitList');
        list.innerHTML = "";
        habits.forEach(h => {
            const div = document.createElement('div');
            div.className = `habit-chip ${activeHabits.includes(h) ? 'active' : ''}`;
            div.innerText = h;
            div.onclick = () => {
                if (activeHabits.includes(h)) activeHabits = activeHabits.filter(a => a !== h);
                else activeHabits.push(h);
                renderHabits();
            };
            list.appendChild(div);
        });
        document.getElementById('addHabitArea').style.display = habits.length >= 10 ? 'none' : 'flex';
    }

    function addNewHabit() {
        const name = document.getElementById('newHabitName').value;
        if (name && habits.length < 10) {
            habits.push(name);
            localStorage.setItem('my_habits', JSON.stringify(habits));
            document.getElementById('newHabitName').value = "";
            renderHabits();
        }
    }

    function saveData() {
        const entry = {
            id: Date.now(),
            time: new Date().toLocaleString('tr-TR'),
            stress: document.getElementById('stressRange').value,
            note: document.getElementById('note').value,
            habits: [...activeHabits],
            image: canvas.toDataURL()
        };
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        logs.unshift(entry);
        localStorage.setItem('neuro_logs', JSON.stringify(logs));
        renderLogs();
        clearCanvas();
        document.getElementById('note').value = "";
        activeHabits = [];
        renderHabits();
    }

    function renderLogs() {
        const container = document.getElementById('history');
        const logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        container.innerHTML = "<h3>Günlük Kayıtları</h3>";
        logs.forEach(item => {
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `
                <div class="delete-btn" onclick="deleteLog(${item.id})">Sil</div>
                <small>${item.time}</small><br>
                <b>Stres: ${item.stress}/10</b>
                <div style="margin:10px 0"><img src="${item.image}" width="70" style="border-radius:50%; border:1px solid #eee"></div>
                <div style="font-size:12px">${item.habits.map(h => '✅'+h).join(' ')}</div>
                <div style="margin-top:5px; font-style:italic">"${item.note}"</div>
            `;
            container.appendChild(div);
        });
    }

    function deleteLog(id) {
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        localStorage.setItem('neuro_logs', JSON.stringify(logs.filter(l => l.id !== id)));
        renderLogs();
    }

    renderHabits();
    renderLogs();
</script>
</body>
</html>
