<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVibe - Advanced Awareness</title>
    <style>
        :root { --bg: #fdfbfb; --accent: #333; --gold: #d4af37; --breath: #87CEEB; --eye: #FF6B6B; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; color: #444; }
        
        .container { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.06); width: 100%; max-width: 500px; text-align: center; position: relative; }

        /* Başlık ve İstatistikler */
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .profile-name { font-weight: bold; border: none; font-size: 1rem; color: var(--accent); outline: none; background: transparent; width: 140px; }
        .stats-row { display: flex; justify-content: space-around; margin: 10px 0; background: #fafafa; padding: 12px; border-radius: 15px; font-size: 11px; border: 1px solid #f0f0f0; }
        .stat-box b { display: block; font-size: 16px; color: var(--accent); }

        /* Çizim Alanı */
        .canvas-container { position: relative; width: 260px; height: 260px; margin: 10px auto; border-radius: 50%; overflow: hidden; background: white; border: 4px solid #f9f9f9; box-shadow: inset 0 0 15px rgba(0,0,0,0.03); }
        canvas { cursor: crosshair; touch-action: none; }

        .draw-tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 10px 0; }
        .tool-btn { padding: 8px; border: none; border-radius: 8px; cursor: pointer; background: #f0f0f0; font-size: 11px; }
        .tool-btn.active { background: var(--accent); color: white; }

        /* Göz Egzersizi */
        .eye-section { background: #fff5f5; padding: 15px; border-radius: 25px; margin: 15px 0; border: 1px solid #fed7d7; }
        #eye-canvas-box { width: 100%; height: 120px; background: white; border-radius: 15px; margin: 10px 0; position: relative; overflow: hidden; border: 1px solid #eee; }
        #eye-dot { width: 15px; height: 15px; background: var(--eye); border-radius: 50%; position: absolute; box-shadow: 0 0 15px rgba(255,107,107,0.6); display: none; will-change: left, top; }
        
        /* Duygu ve Yoğunluk (Her biri için özel) */
        .emotion-section { text-align: left; background: #fcfcfc; padding: 15px; border-radius: 20px; border: 1px solid #eee; margin: 15px 0; }
        .emo-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 5px; border-radius: 10px; transition: 0.2s; }
        .emo-row.selected { background: #e8f0fe; }
        .emo-info { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; flex: 1; }
        .emo-slider { width: 100px; cursor: pointer; accent-color: var(--accent); opacity: 0.3; pointer-events: none; }
        .emo-row.selected .emo-slider { opacity: 1; pointer-events: auto; }

        /* Alt Alanlar */
        textarea { width: 100%; border-radius: 15px; border: 1px solid #eee; padding: 15px; box-sizing: border-box; margin: 10px 0; font-family: inherit; font-size: 14px; min-height: 100px; }
        #save-btn { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 15px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }

        /* Geçmiş & Notlar */
        .history-section { width: 100%; max-width: 500px; margin-top: 30px; }
        .log-card { background: white; padding: 20px; border-radius: 25px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); text-align: left; position: relative; border-left: 8px solid var(--accent); }
        .log-img { width: 80px; height: 80px; border-radius: 50%; float: right; margin-left: 15px; border: 2px solid #f0f0f0; }
        .log-note { font-size: 13px; color: #555; background: #f9f9f9; padding: 10px; border-radius: 10px; margin-top: 10px; white-space: pre-wrap; clear: both; }
        .delete-btn { position: absolute; right: 15px; top: 15px; color: #ccc; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div id="celebration" style="position:absolute; top:-20px; width:100%; display:none; color:var(--gold); font-weight:bold; text-align:center; z-index:100;">✨ HARİKASIN ✨</div>
        <div class="header-row">
            <div>👋 <input type="text" id="userName" class="profile-name" placeholder="İsmin?"></div>
            <div id="clock" style="font-size: 12px; color: #aaa;"></div>
        </div>

        <div class="stats-row">
            <div class="stat-box"><b id="stat-count">0</b>Günlük</div>
            <div class="stat-box"><b id="stat-stress">0</b>Ort. Stres</div>
            <div class="stat-box"><b id="stat-habits">0%</b>Başarı</div>
        </div>

        <div class="canvas-container"><canvas id="paintCanvas" width="260" height="260"></canvas></div>

        <div class="draw-tools">
            <input type="color" id="colorPicker" value="#FFD700" style="width:100%; height:30px;">
            <button class="tool-btn active" id="btn-sulu" onclick="setTool('sulu')">Sulu</button>
            <button class="tool-btn" id="btn-murekkep" onclick="setTool('murekkep')">Mürek.</button>
            <button class="tool-btn" onclick="undo()">↩️ Geri</button>
            <button class="tool-btn" onclick="clearCanvas()">🗑️ Sil</button>
        </div>

        <!-- Göz Egzersizi -->
        <div class="eye-section">
            <div id="eye-instruction" style="font-weight:bold; color:var(--eye); font-size:12px;">Göz Odaklama Başlat</div>
            <div id="eye-canvas-box"><div id="eye-dot"></div></div>
            <small style="font-size:10px; color:#999; display:block; margin-bottom:10px;">Ekrana bakmadan da zihninde zigzaglar çizebilirsin.</small>
            <button class="tool-btn" id="eyeBtn" onclick="startEyeExercise()" style="background:var(--eye); color:white; width:auto; padding:8px 20px;">Egzersizi Başlat</button>
        </div>

        <!-- Çoklu Duygu Yoğunluğu -->
        <div class="emotion-section">
            <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:10px;">Şu Anki Modların ve Yoğunlukları:</label>
            <div id="emo-list">
                <div class="emo-row" id="row-Mutlu">
                    <div class="emo-info" onclick="toggleEmo('Mutlu')">😊 Mutlu</div>
                    <input type="range" class="emo-slider" min="0" max="100" step="25" value="50" oninput="updateEmoVal('Mutlu', this.value)">
                    <span id="val-Mutlu" style="font-size:10px; width:30px; text-align:right; margin-left:5px;">%50</span>
                </div>
                <div class="emo-row" id="row-Huzurlu">
                    <div class="emo-info" onclick="toggleEmo('Huzurlu')">😌 Huzurlu</div>
                    <input type="range" class="emo-slider" min="0" max="100" step="25" value="50" oninput="updateEmoVal('Huzurlu', this.value)">
                    <span id="val-Huzurlu" style="font-size:10px; width:30px;">%50</span>
                </div>
                <div class="emo-row" id="row-Öfkeli">
                    <div class="emo-info" onclick="toggleEmo('Öfkeli')">😠 Öfkeli</div>
                    <input type="range" class="emo-slider" min="0" max="100" step="25" value="50" oninput="updateEmoVal('Öfkeli', this.value)">
                    <span id="val-Öfkeli" style="font-size:10px; width:30px;">%50</span>
                </div>
                <div class="emo-row" id="row-Sıkkın">
                    <div class="emo-info" onclick="toggleEmo('Sıkkın')">😑 Sıkkın</div>
                    <input type="range" class="emo-slider" min="0" max="100" step="25" value="50" oninput="updateEmoVal('Sıkkın', this.value)">
                    <span id="val-Sıkkın" style="font-size:10px; width:30px;">%50</span>
                </div>
            </div>
        </div>

        <div style="text-align:left; font-size:12px; font-weight:bold; margin-bottom:10px;">
            Genel Stres: <span id="stressLabel">Harikayım (0)</span>
            <input type="range" id="stressRange" min="0" max="10" value="0" oninput="updateStress(this.value)" style="width:100%">
        </div>

        <textarea id="note" maxlength="2000" placeholder="Bugünün derin notu (Hafızana kazınacak)..."></textarea>
        <button id="save-btn" onclick="saveData()">Günü Mühürle</button>
    </div>

    <div id="logHistory" class="history-section"></div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false; let currentTool = 'sulu'; let undoStack = [];
    let activeEmos = {}; let eyeDone = false;

    // Çizim
    function saveState() { if (undoStack.length > 20) undoStack.shift(); undoStack.push(canvas.toDataURL()); }
    function undo() { if (undoStack.length > 0) { let img = new Image(); img.src = undoStack.pop(); img.onload = () => { ctx.clearRect(0,0,260,260); ctx.drawImage(img,0,0); }; } }
    function clearCanvas() { saveState(); ctx.clearRect(0,0,260,260); }
    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        const color = document.getElementById('colorPicker').value;
        ctx.lineCap = 'round'; ctx.strokeStyle = color;
        if (currentTool === 'sulu') { ctx.globalAlpha = 0.1; ctx.lineWidth = 25; }
        else { ctx.globalAlpha = 0.8; ctx.lineWidth = 5; }
        ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
    }
    canvas.addEventListener('mousedown', (e) => { saveState(); painting = true; draw(e); });
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
    canvas.addEventListener('touchstart', (e) => { saveState(); painting = true; draw(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });

    function setTool(t) { currentTool = t; document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+t)?.classList.add('active'); }

    // Göz Egzersizi (Yüksek FPS)
    async function startEyeExercise() {
        const dot = document.getElementById('eye-dot');
        const inst = document.getElementById('eye-instruction');
        const btn = document.getElementById('eyeBtn');
        btn.disabled = true; dot.style.display = 'block';

        const animateDot = (start, end, duration) => {
            return new Promise(resolve => {
                let startT = null;
                const frame = (now) => {
                    if(!startT) startT = now;
                    const progress = Math.min((now - startT) / duration, 1);
                    dot.style.left = (start.x + (end.x - start.x) * progress) + '%';
                    dot.style.top = (start.y + (end.y - start.y) * progress) + '%';
                    if(progress < 1) requestAnimationFrame(frame);
                    else resolve();
                };
                requestAnimationFrame(frame);
            });
        };

        inst.innerText = "Noktayı Takip Et...";
        await animateDot({x:0,y:0},{x:90,y:85},8000);
        await animateDot({x:90,y:85},{x:0,y:0},8000);
        for(let i=0; i<4; i++){
            await animateDot({x:5,y:0},{x:5,y:85},2000);
            await animateDot({x:5,y:85},{x:5,y:0},2000);
        }
        inst.innerText = "Gözler Dinlendi!"; dot.style.display = 'none';
        btn.disabled = false; eyeDone = true;
    }

    // Duygu Yönetimi
    function toggleEmo(emo) {
        const row = document.getElementById('row-'+emo);
        if(activeEmos[emo]) { delete activeEmos[emo]; row.classList.remove('selected'); }
        else { activeEmos[emo] = 50; row.classList.add('selected'); }
    }
    function updateEmoVal(emo, val) {
        activeEmos[emo] = val;
        document.getElementById('val-'+emo).innerText = '%' + val;
    }

    function updateStress(val) {
        let texts = ["Harikayım", "Ucundan stresli", "Ucundan stresli", "Az stresli", "Az stresli", "Nötr", "Giderek artıyor", "Giderek artıyor", "Stresliyim", "Stresliyim", "WOW!"];
        document.getElementById('stressLabel').innerText = `${texts[val]} (${val})`;
    }

    function updateStats() {
        const logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        document.getElementById('stat-count').innerText = logs.length;
        if(logs.length > 0) {
            const avgS = (logs.reduce((acc, c) => acc + parseInt(c.stress || 0), 0) / logs.length).toFixed(1);
            document.getElementById('stat-stress').innerText = avgS;
            document.getElementById('stat-habits').innerText = Math.round((logs.filter(l => l.eye).length / logs.length) * 100) + "%";
        }
    }

    function saveData() {
        const entry = {
            id: Date.now(),
            time: new Date().toLocaleString('tr-TR'),
            emos: {...activeEmos},
            stress: document.getElementById('stressRange').value,
            note: document.getElementById('note').value,
            image: canvas.toDataURL(),
            eye: eyeDone
        };
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        logs.unshift(entry);
        localStorage.setItem('neuro_logs', JSON.stringify(logs));
        renderLogs(); updateStats(); clearCanvas(); eyeDone = false;
        document.getElementById('note').value = "";
    }

    function renderLogs() {
        const container = document.getElementById('logHistory');
        const logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        container.innerHTML = "<h3>Sanatsal Zaman Tüneli</h3>";
        logs.forEach(l => {
            const emosTxt = Object.entries(l.emos).map(([k, v]) => `${k} (%${v})`).join(', ');
            const card = document.createElement('div');
            card.className = "log-card";
            card.innerHTML = `
                <div class="delete-btn" onclick="deleteLog(${l.id})">×</div>
                <img src="${l.image}" class="log-img">
                <div style="font-size:11px; color:#999;">${l.time}</div>
                <div style="font-size:12px; font-weight:bold; margin:5px 0;">Mod: ${emosTxt || 'Nötr'}</div>
                <div style="font-size:12px;">Stres: ${l.stress}/10 | ${l.eye ? '👁️ Göz Egz. Yapıldı' : ''}</div>
                ${l.note ? `<div class="log-note">${l.note}</div>` : ''}
            `;
            container.appendChild(card);
        });
    }

    function deleteLog(id) {
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        localStorage.setItem('neuro_logs', JSON.stringify(logs.filter(l => l.id !== id)));
        renderLogs(); updateStats();
    }

    document.getElementById('userName').value = localStorage.getItem('neuro_username') || "";
    document.getElementById('userName').onchange = (e) => localStorage.setItem('neuro_username', e.target.value);
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}); }, 1000);
    renderLogs(); updateStats();
</script>
</body>
</html>
