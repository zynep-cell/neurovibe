<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVibe - Master Edition</title>
    <style>
        :root { --bg: #fdfbfb; --accent: #333; --gold: #d4af37; --breath: #87CEEB; --eye: #FF6B6B; --music: #a29bfe; --custom: #55efc4; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; color: #444; }
        .container { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.06); width: 100%; max-width: 500px; text-align: center; position: relative; }

        /* Başlık ve İstatistikler */
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .stats-row { display: flex; justify-content: space-around; margin: 10px 0; background: #fafafa; padding: 12px; border-radius: 15px; font-size: 11px; border: 1px solid #f0f0f0; }
        .stat-box b { display: block; font-size: 16px; color: var(--accent); }

        /* Çizim Alanı */
        .canvas-container { position: relative; width: 260px; height: 260px; margin: 10px auto; border-radius: 50%; overflow: hidden; background: white; border: 4px solid #f9f9f9; box-shadow: inset 0 0 15px rgba(0,0,0,0.03); }
        canvas { cursor: crosshair; touch-action: none; background: white; }
        .draw-tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 10px 0; }
        .tool-btn { padding: 8px; border: none; border-radius: 8px; cursor: pointer; background: #f0f0f0; font-size: 11px; }
        .tool-btn.active { background: var(--accent); color: white; }

        /* Egzersiz Kutuları */
        .ex-box { background: #fafafa; padding: 15px; border-radius: 20px; border: 1px solid #eee; margin: 10px 0; }
        #breath-circle { width: 50px; height: 50px; background: var(--breath); border-radius: 50%; margin: 10px auto; display: flex; align-items: center; justify-content: center; transition: transform 1s ease-in-out; opacity: 0.7; }
        
        /* Sayaçlar */
        .timer-val { font-size: 22px; font-weight: bold; margin: 5px 0; color: var(--accent); }
        .custom-ex-section { background: #f1fcf9; padding: 15px; border-radius: 20px; border: 1px solid #d1f2eb; text-align: left; margin: 10px 0; }
        .ex-chip { background: white; padding: 5px 10px; border-radius: 10px; font-size: 11px; border: 1px solid #eee; cursor: pointer; display: inline-block; margin: 2px; }

        /* Multimedya */
        .memory-section { background: #fcfcfc; padding: 15px; border-radius: 20px; border: 1px solid #eee; margin: 15px 0; text-align: left; }
        .memory-input { width: 100%; padding: 8px; margin: 5px 0; border-radius: 8px; border: 1px solid #eee; font-size: 12px; box-sizing: border-box; }
        .photo-actions { display: flex; gap: 5px; margin-top: 5px; }

        /* Duygular */
        .emo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 15px 0; }
        .emo-row { display: flex; align-items: center; gap: 5px; background: #f9f9f9; padding: 5px; border-radius: 10px; }
        .emo-slider { flex: 1; accent-color: var(--accent); }

        textarea { width: 100%; border-radius: 15px; border: 1px solid #eee; padding: 15px; box-sizing: border-box; margin: 10px 0; min-height: 80px; font-family: inherit; }
        #save-btn { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 15px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }

        /* Zaman Tüneli Kartları */
        .log-card { background: white; padding: 15px; border-radius: 25px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-left: 8px solid var(--accent); position: relative; text-align: left; }
        .log-canvas { width: 80px; height: 80px; border-radius: 50%; float: right; border: 2px solid #eee; background: white; }
        .log-photo { width: 100%; border-radius: 15px; margin-top: 10px; }
        .log-emo-tag { font-size: 10px; background: #eee; padding: 2px 6px; border-radius: 8px; margin-right: 3px; display: inline-block; margin-top: 3px; }

        #celebration { position: absolute; top: -15px; width: 100%; color: var(--gold); font-weight: bold; display: none; text-align: center; z-index: 100; animation: bounce 0.5s infinite alternate; }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="celebration">✨ HARİKASIN. DEVAM ET. ✨</div>
        <div class="header-row">
            <div>👋 <input type="text" id="userName" style="border:none; outline:none; font-weight:bold; background:transparent; width:120px;" placeholder="İsmin?"></div>
            <div id="clock" style="font-size: 11px; color: #999;"></div>
        </div>

        <div class="stats-row">
            <div class="stat-box"><b id="stat-count">0</b>Mühür</div>
            <div class="stat-box"><b id="stat-stress">0</b>Ort. Stres</div>
            <div class="stat-box"><b id="stat-habits">0%</b>Başarı</div>
        </div>

        <div class="canvas-container"><canvas id="paintCanvas" width="260" height="260"></canvas></div>

        <div class="draw-tools">
            <input type="color" id="colorPicker" value="#FFD700" style="width:100%; grid-column: span 4; height:25px; border:none; background:none; cursor:pointer;">
            <input type="range" id="sizeRange" min="1" max="60" value="15" style="width:100%; grid-column: span 4;">
            <button class="tool-btn active" id="btn-sulu" onclick="setTool('sulu')">💧 Sulu</button>
            <button class="tool-btn" id="btn-puskurtme" onclick="setTool('puskurtme')">💨 Püskürt</button>
            <button class="tool-btn" id="btn-murekkep" onclick="setTool('murekkep')">🖋️ Mürek.</button>
            <button class="tool-btn" id="btn-kursun" onclick="setTool('kursun')">✏️ Kurşun</button>
            <button class="tool-btn" id="btn-eraser" onclick="setTool('eraser')">🧽 Silgi</button>
            <button class="tool-btn" onclick="undo()">↩️ Geri</button>
            <button class="tool-btn" onclick="redo()">↪️ İleri</button>
            <button class="tool-btn" onclick="clearCanvas()" style="background:#ddd">🗑️ Sil</button>
        </div>

        <!-- Sayaçlı Egzersizler -->
        <div class="ex-box" style="background:#f0f8ff;">
            <div style="font-size:11px; font-weight:bold; color:#4682B4;">4-7-8 NEFES</div>
            <div id="breath-circle"><span id="breath-sec" style="color:white; font-weight:bold;">0</span></div>
            <div id="breath-txt" style="font-size:10px; color:#4682B4;">HAZIR MIYIZ?</div>
            <button class="tool-btn" id="breathBtn" onclick="startBreathing()" style="background:var(--breath); color:white; width:100%; margin-top:10px;">Nefesi Başlat</button>
        </div>

        <div class="ex-box" style="background:#fff5f5;">
            <div style="font-size:11px; font-weight:bold; color:var(--eye);">GÖZ EGZERSİZİ</div>
            <div class="timer-val" id="eye-timer">60s</div>
            <button class="tool-btn" id="eyeBtn" onclick="runTimer(60, '👁️ Göz', 'eye-timer', 'eyeBtn')" style="background:var(--eye); color:white; width:100%;">Gözü Başlat</button>
        </div>

        <div class="custom-ex-section">
            <div style="font-size:11px; font-weight:bold; color:var(--custom);">ÖZEL SAYAÇ</div>
            <div style="display:flex; gap:3px; margin-top:5px;">
                <input type="text" id="custName" class="memory-input" placeholder="Adı" style="margin:0">
                <select id="custTime" class="memory-input" style="width:70px; margin:0"><option value="15">15s</option><option value="30">30s</option><option value="60">60s</option></select>
                <button onclick="addCustomEx()" class="tool-btn" style="background:var(--custom); color:white;">+</button>
            </div>
            <div id="custExList" style="margin-top:10px;"></div>
            <div id="cust-timer-view" class="timer-val" style="display:none; text-align:center; color:var(--custom);">0s</div>
        </div>

        <!-- Hafıza Modülü -->
        <div class="memory-section">
            <input type="text" id="songName" class="memory-input" placeholder="🎵 Günün Şarkısı">
            <input type="text" id="songUrl" class="memory-input" placeholder="🔗 Şarkı Linki">
            <div class="photo-actions">
                <label for="photoInput" class="tool-btn" style="flex:1; text-align:center; background:#eee">📸 Fotoğraf Ekle/Değiştir</label>
                <button onclick="removePhoto()" class="tool-btn" style="background:#ffdada; color:red">Sil</button>
            </div>
            <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="handlePhoto(this)">
            <img id="photo-preview" src="" style="width:100%; border-radius:10px; margin-top:10px; display:none;">
        </div>

        <div class="weather-grid">
            <span class="weather-icon" onclick="setWeather('sunny','☀️')">☀️</span>
            <span class="weather-icon" onclick="setWeather('cloudy','⛅')">⛅</span>
            <span class="weather-icon" onclick="setWeather('moon','🌙')">🌙</span>
            <span class="weather-icon" onclick="setWeather('rainy','🌧️')">🌧️</span>
            <span class="weather-icon" onclick="setWeather('stormy','⚡')">⚡</span>
            <span class="weather-icon" onclick="setWeather('windy','🌬️')">🌬️</span>
        </div>
        <div id="weather-tip" style="font-size:11px; color:var(--gold); font-style:italic; min-height:15px;"></div>

        <div class="emo-grid">
            <div class="emo-row" id="r-Mutlu"><span onclick="toggleEmo('Mutlu')" style="cursor:pointer">😊</span> <input type="range" class="emo-slider" oninput="updateEmo('Mutlu',this.value)" value="50"></div>
            <div class="emo-row" id="r-Huzurlu"><span onclick="toggleEmo('Huzurlu')" style="cursor:pointer">😌</span> <input type="range" class="emo-slider" oninput="updateEmo('Huzurlu',this.value)" value="50"></div>
            <div class="emo-row" id="r-Öfkeli"><span onclick="toggleEmo('Öfkeli')" style="cursor:pointer">😠</span> <input type="range" class="emo-slider" oninput="updateEmo('Öfkeli',this.value)" value="50"></div>
            <div class="emo-row" id="r-Kızgın"><span onclick="toggleEmo('Kızgın')" style="cursor:pointer">😡</span> <input type="range" class="emo-slider" oninput="updateEmo('Kızgın',this.value)" value="50"></div>
            <div class="emo-row" id="r-Sıkkın"><span onclick="toggleEmo('Sıkkın')" style="cursor:pointer">😑</span> <input type="range" class="emo-slider" oninput="updateEmo('Sıkkın',this.value)" value="50"></div>
            <div class="emo-row" id="r-Nötr"><span onclick="toggleEmo('Nötr')" style="cursor:pointer">😐</span> <input type="range" class="emo-slider" oninput="updateEmo('Nötr',this.value)" value="50"></div>
        </div>

        <div style="text-align:left; font-size:12px; font-weight:bold; margin-bottom:10px;">
            Stres: <span id="stressLabel">Harikayım (0)</span>
            <input type="range" id="stressRange" min="0" max="10" value="0" oninput="updateStress(this.value)" style="width:100%; accent-color:#333;">
        </div>

        <div id="habitList" class="draw-tools" style="grid-template-columns:repeat(3, 1fr); gap:5px; margin:10px 0;"></div>
        <div style="display:flex; gap:5px;"><input type="text" id="newHabInput" placeholder="Alışkanlık..." style="flex:1; border-radius:10px; border:1px solid #eee; padding:5px;"> <button onclick="addNewHabit()" class="tool-btn" style="background:#333; color:white;">+</button></div>

        <textarea id="note" maxlength="2000" placeholder="Bugünün notu..."></textarea>
        <button id="save-btn" onclick="saveData()">Günü Mühürle</button>
    </div>
    <div id="logHistory" style="width:100%; max-width:500px; margin-top:20px;"></div>

<script>
    const canvas = document.getElementById('paintCanvas'); const ctx = canvas.getContext('2d');
    let painting = false; let currentTool = 'sulu'; let undoStack = []; let redoStack = [];
    let activeEmos = {}; let selectedWeather = "✨"; let completedEx = []; let base64Photo = "";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTick(f, d) { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.05, audioCtx.currentTime); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); }

    function setTool(t) { currentTool=t; document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active')); document.getElementById('btn-'+t)?.classList.add('active'); }
    function saveState() { if(undoStack.length>30) undoStack.shift(); undoStack.push(canvas.toDataURL()); redoStack = []; }
    function undo() { if(undoStack.length>0) { redoStack.push(canvas.toDataURL()); let img=new Image(); img.src=undoStack.pop(); img.onload=()=> { ctx.clearRect(0,0,260,260); ctx.drawImage(img,0,0); } } }
    function redo() { if(redoStack.length>0) { undoStack.push(canvas.toDataURL()); let img=new Image(); img.src=redoStack.pop(); img.onload=()=> { ctx.clearRect(0,0,260,260); ctx.drawImage(img,0,0); } } }
    function clearCanvas() { saveState(); ctx.clearRect(0,0,260,260); }

    function draw(e) {
        if(!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        const color = document.getElementById('colorPicker').value;
        const size = document.getElementById('sizeRange').value;
        ctx.lineCap='round'; ctx.strokeStyle=color; ctx.lineWidth=size;
        if(currentTool==='eraser') { ctx.strokeStyle='#fff'; ctx.lineWidth=35; ctx.globalAlpha=1; }
        else if(currentTool==='sulu') ctx.globalAlpha=0.1;
        else if(currentTool==='murekkep') { ctx.globalAlpha=0.8; ctx.lineWidth=size*0.4; }
        else if(currentTool==='kursun') { ctx.globalAlpha=0.3; ctx.lineWidth=1.5; }
        else if(currentTool==='puskurtme') {
            ctx.fillStyle=color; ctx.globalAlpha=0.3;
            for(let i=0;i<10;i++) ctx.fillRect(x+(Math.random()-0.5)*size, y+(Math.random()-0.5)*size, 2, 2); return;
        }
        ctx.lineTo(x,y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,y);
    }
    canvas.addEventListener('mousedown', (e)=>{ saveState(); painting=true; draw(e); });
    canvas.addEventListener('mousemove', draw); window.addEventListener('mouseup', ()=>{ painting=false; ctx.beginPath(); });
    canvas.addEventListener('touchstart', (e)=>{ saveState(); painting=true; draw(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e)=>{ draw(e); e.preventDefault(); });

    // Sayaç Motoru
    function runTimer(sec, name, dispId, btnId) {
        let t = sec; const d = document.getElementById(dispId); const b = document.getElementById(btnId);
        if(b) b.disabled = true; if(dispId==='cust-timer-view') d.style.display='block';
        const iv = setInterval(() => {
            t--; d.innerText = t + "s";
            if(t%5===0) playTick(600, 0.05);
            if(t<=0) { clearInterval(iv); d.innerText = "BİTTİ!"; if(b) b.disabled=false; completedEx.push(name); showCel(); }
        }, 1000);
    }

    async function startBreathing() {
        const b = document.getElementById('breathBtn'); b.disabled=true;
        const circle = document.getElementById('breath-circle'); const txt = document.getElementById('breath-txt'); const sec = document.getElementById('breath-sec');
        for(let i=0; i<3; i++){
            txt.innerText="AL"; circle.style.transform="scale(2.5)"; for(let s=4;s>0;s--){ sec.innerText=s; playTick(440,0.05); await new Promise(r=>setTimeout(r,1000)); }
            txt.innerText="TUT"; for(let s=7;s>0;s--){ sec.innerText=s; playTick(554,0.05); await new Promise(r=>setTimeout(r,1000)); }
            txt.innerText="VER"; circle.style.transform="scale(1)"; for(let s=8;s>0;s--){ sec.innerText=s; playTick(330,0.05); await new Promise(r=>setTimeout(r,1000)); }
        }
        txt.innerText="HAZIR!"; sec.innerText="✓"; b.disabled=false; completedEx.push("🧘 Nefes"); showCel();
    }

    function addCustomEx() {
        const n = document.getElementById('custName').value; const t = document.getElementById('custTime').value;
        if(!n) return;
        let list = JSON.parse(localStorage.getItem('neuro_customs')) || [];
        list.push({n, t}); localStorage.setItem('neuro_customs', JSON.stringify(list)); renderCustoms();
    }
    function renderCustoms() {
        const list = JSON.parse(localStorage.getItem('neuro_customs')) || [];
        const box = document.getElementById('custExList'); box.innerHTML = "";
        list.forEach((ex, i) => {
            const chip = document.createElement('div'); chip.className = "ex-chip";
            chip.innerHTML = `${ex.n} (${ex.t}s) <b onclick="delEx(event,${i})">×</b>`;
            chip.onclick = () => runTimer(ex.t, ex.n, 'cust-timer-view', null);
            box.appendChild(chip);
        });
    }
    function delEx(e, i) { e.stopPropagation(); let list = JSON.parse(localStorage.getItem('neuro_customs')); list.splice(i,1); localStorage.setItem('neuro_customs', JSON.stringify(list)); renderCustoms(); }

    // Fotoğraf & Diğerleri
    function handlePhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas'); const s = 400; let w=img.width, h=img.height;
                    if(w>h){ if(w>s){h*=s/w; w=s;} } else { if(h>s){w*=s/h; h=s;} }
                    c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
                    base64Photo = c.toDataURL('image/jpeg',0.5);
                    document.getElementById('photo-preview').src = base64Photo;
                    document.getElementById('photo-preview').style.display = 'block';
                };
                img.src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
    function removePhoto() { base64Photo=""; document.getElementById('photo-preview').style.display='none'; document.getElementById('photoInput').value=""; }

    function updateStress(v) { let tx=["Harikayım","Ucundan stresli","Ucundan stresli","Az stresli","Az stresli","Nötr","Giderek artıyor","Giderek artıyor","Stresliyim","Stresliyim","WOW!"]; document.getElementById('stressLabel').innerText=`${tx[v]} (${v})`; }
    function setWeather(t,i) { selectedWeather=i; document.querySelectorAll('.weather-icon').forEach(v=>v.classList.toggle('active',v.innerText===i)); const tips={sunny:"D Vitamini!☀️",cloudy:"Yumuşak Hava⛅",moon:"Yıldızlar🌙",rainy:"Yağmur Sesi🌧️",stormy:"Fırtına Geçecek⚡",windy:"Akışta Kal🌬️"}; document.getElementById('weather-tip').innerText=tips[t]; }
    function toggleEmo(e) { const r=document.getElementById('r-'+e); if(activeEmos[e]){ delete activeEmos[e]; r.style.background="none"; } else { activeEmos[e]=50; r.style.background="#e8f0fe"; } }
    function updateEmo(e,v) { activeEmos[e]=v; }
    function showCel() { const c=document.getElementById('celebration'); c.style.display='block'; setTimeout(()=>c.style.display='none',3000); }

    let habits = JSON.parse(localStorage.getItem('neuro_habits')) || ["Lenf Vuruşları"]; let activeHabits=[];
    function renderHabits() {
        const l=document.getElementById('habitList'); l.innerHTML="";
        habits.forEach((h,i)=>{ const d=document.createElement('button'); d.className='tool-btn'; if(activeHabits.includes(h)) d.classList.add('active'); d.innerHTML=h; d.onclick=()=>{ if(activeHabits.includes(h)) activeHabits=activeHabits.filter(a=>a!==h); else { activeHabits.push(h); showCel(); } renderHabits(); }; l.appendChild(d); });
    }
    function addNewHabit() { const v=document.getElementById('newHabInput').value; if(v){ habits.push(v); localStorage.setItem('neuro_habits',JSON.stringify(habits)); renderHabits(); } }

    function updateStats() {
        const logs=JSON.parse(localStorage.getItem('neuro_logs'))||[]; document.getElementById('stat-count').innerText=logs.length;
        if(logs.length>0){ const avg=logs.reduce((a,c)=>a+parseInt(c.stress||0),0)/logs.length; document.getElementById('stat-stress').innerText=avg.toFixed(1); const success = logs.filter(l => l.habits && l.habits.length > 0).length; document.getElementById('stat-habits').innerText = Math.round((success/logs.length)*100) + "%"; }
    }

    function saveData() {
        const fh = [...activeHabits, ...completedEx];
        const entry={ id:Date.now(), time:new Date().toLocaleString('tr-TR'), stress:document.getElementById('stressRange').value, weather:selectedWeather, note:document.getElementById('note').value, image:canvas.toDataURL('image/png'), habits:fh, emos:{...activeEmos}, song:document.getElementById('songName').value, songUrl:document.getElementById('songUrl').value, photo:base64Photo };
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || []; logs.unshift(entry); localStorage.setItem('neuro_logs', JSON.stringify(logs));
        renderLogs(); updateStats(); clearCanvas(); activeHabits=[]; completedEx=[]; base64Photo=""; 
        document.getElementById('note').value=""; document.getElementById('songName').value=""; document.getElementById('songUrl').value=""; document.getElementById('photo-preview').style.display="none";
        activeEmos={}; document.querySelectorAll('.emo-row').forEach(r=>r.style.background="none"); renderHabits(); showCel();
    }

    function renderLogs() {
        const g=document.getElementById('logHistory'); g.innerHTML="<h3>Zaman Tüneli</h3>";
        let logs = JSON.parse(localStorage.getItem('neuro_logs')) || [];
        logs.forEach(l=>{
            const emTxt = Object.entries(l.emos || {}).map(([k,v])=>`<span class="log-emo-tag">${k} (%${v})</span>`).join('');
            const card=document.createElement('div'); card.className="log-card";
            card.innerHTML=`<div onclick="deleteLog(${l.id})" style="position:absolute;top:10px;right:10px;cursor:pointer;color:#ccc;">×</div><img src="${l.image}" class="log-canvas"><b>${l.time} ${l.weather}</b><br><small>Stres:${l.stress}/10 | ${l.habits.join(', ')}</small><br>${emTxt}${l.song ? `<br><a href="${l.songUrl}" target="_blank" style="color:var(--music); font-size:11px; text-decoration:none;">♫ ${l.song}</a>` : ''}${l.photo ? `<img src="${l.photo}" class="log-photo">` : ''}<div style="font-size:12px; margin-top:10px; white-space:pre-wrap; background:#f9f9f9; padding:8px; border-radius:8px;">${l.note}</div>`;
            g.appendChild(card);
        });
    }
    function deleteLog(id){ let l=JSON.parse(localStorage.getItem('neuro_logs')); localStorage.setItem('neuro_logs',JSON.stringify(l.filter(x=>x.id!==id))); renderLogs(); updateStats(); }

    document.getElementById('userName').value=localStorage.getItem('neuro_username')||"";
    document.getElementById('userName').onchange=(e)=>localStorage.setItem('neuro_username',e.target.value);
